# SonarQube Cloud, automatische analyse (project palmw01_wetsanalyse-ai, plan OSS).
#
# De automatische analyse leest dit bestand van de geanalyseerde branch. Het zegt wat broncode is, wat test is, en
# wat Sonar overslaat: gegenereerde code (die wijzig je via het generatorscript, niet met de hand), data en
# documentatie. Een bevinding in een gegenereerd bestand is ruis; die los je op in de bron (skill of generator).

# Broncode van de draaiende onderdelen en de gedeelde pakketten.
sonar.sources=api/app,frontend,tools/graph-qa/agent,tools/graph-qa/api,tools/graph-qa/scripts,tools/bwb-import/app,tools/bwb-import/main.py,tools/wetsanalyse-admin-mcp,tools/wetsanalyse-acceptatie-mcp,packages/bronmodel/bronmodel,scripts,deploy/azure

# Tests: herkend als test, dus geen dekking- of duplicatie-eisen als op productiecode.
sonar.tests=api/tests,tools/graph-qa/tests,tools/bwb-import/tests,tests,frontend,tools/wetsanalyse-acceptatie-mcp
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,frontend/scripts/test-*.mjs,frontend/test/**

# Niet analyseren.
sonar.exclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  frontend/scripts/test-*.mjs,\
  frontend/test/**,\
  frontend/public/**,\
  frontend/merk/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/fixtures/**,\
  api/app/jas_relaties.py,\
  api/app/jas_begripverwachting.py,\
  api/app/jas_regelgaten.py,\
  frontend/lib/jasRelaties.ts,\
  frontend/lib/jasBegripverwachting.ts,\
  frontend/lib/graaf/proefgraaf.ts,\
  tools/graph-qa/agent/jas_relaties.py,\
  tools/graph-qa/agent/jas_toelichting.py,\
  tools/graph-qa/agent/methodepakket.py,\
  tools/graph-qa/agent/agentprofielen.py,\
  tools/graph-qa/agent/bronpakket.json,\
  packages/bronmodel/bronmodel/bwb/schemas/**

# Het JAS_KLASSEN-blok in jas_klassen.py is gegenereerd; de rest van het bestand niet. Alleen buiten de
# duplicatiemeting houden.
sonar.cpd.exclusions=tools/graph-qa/agent/jas_klassen.py

sonar.python.version=3.13,3.14
sonar.sourceEncoding=UTF-8
