# Woorden die op taalniveau B1 moeilijk zijn, met een gewoon woord dat meestal past (spoor I2).
#
# Eigen keuze, in eigen woorden; de B1-regels zelf staan in de skill
# (`.claude/skills/wetsanalyse/references/nl-sbb-en-b1.md`). Een treffer is een aandachtspunt bij een
# uitleg van Lex, geen verbod: soms is het moeilijke woord het juiste. Vaktermen en wetsnamen staan
# hier niet: die laat een uitleg staan en legt ze uit.
#
# Sleutel: het woord zoals het in de tekst staat, in kleine letters (ook vervoegde vormen apart).
