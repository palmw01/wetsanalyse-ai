# Afleidingsregel (H2:71-73; profiel 06_afleidingsregel.yaml). De span is het normsegment
# (tussen . ; :), want de regel draagt invoer, bewerking en uitkomst; een los 'bedraagt' is geen regel.
# Een rechtsgevolg dat een moment vastlegt ('vervalt één maand na …', code DATE_ASSIGNMENT,
# jas.afleiding.datumtoewijzing) staat niet hier maar in de gevolgdetector: het vraagt de parse (hoofdzin)
# én de treffers van tijd.yaml, geen eigen tijdregex. 'wordt … gesteld op' dekken wordt_gesteld_op hieronder
# en de passieve toewijzing in functies.py al.
- id: jas.afleiding.bedraagt
  klassen: [Afleidingsregel, Parameter en parameterwaarde]
  code: CALCULATION_COPULA
  bewijs: zwak
  bron: "H2:73"
  versie: 3
  bereik: segment
  niet_binnen: []
  niet_woordsoort: ['NOUN:zinsdeel']
  patroon: '[\s\S]*?(?<!minder )(?<!meer )\b(?P<doel>bedraagt|bedragen)\b(?!\s+(?:\w+\s+)?dan\b)[\s\S]*'
  tests:
    positief: [{tekst: "De dwangsom bedraagt € 23 per dag.", span: "De dwangsom bedraagt € 23 per dag."}]
    negatief: [{tekst: "Indien de premie minder bedraagt dan de standaardpremie", span: "minder bedraagt dan"}]
    rand: [{tekst: "In afwijking van het eerste lid bedraagt de aanspraak vijftig procent.", span: "In afwijking van het eerste lid bedraagt de aanspraak vijftig procent."}]
    overlap: [{tekst: "De premie bedraagt een percentage van het inkomen, vermeerderd met € 10.", spans: ["De premie bedraagt een percentage van het inkomen, vermeerderd met € 10.", "vermeerderd met"]}]
- id: jas.afleiding.wordt_gesteld_op
  klassen: [Afleidingsregel]
  code: CALCULATION_PASSIVE
  bewijs: zwak
  bron: "H2:73"
  versie: 3
  bereik: segment
  niet_binnen: []
  patroon: '[\s\S]*?\b(?:wordt|worden)\b[\s\S]*?\b(?:gesteld\s+op|bepaald\s+op|berekend|vastgesteld\s+op|in\s+aanmerking\s+genomen)\b'
  rechts: '[\s\S]*'
  tests:
    positief: [{tekst: "Voor een verzekerde met een partner wordt daarbij tweemaal de standaardpremie in aanmerking genomen; klaar.", span: "Voor een verzekerde met een partner wordt daarbij tweemaal de standaardpremie in aanmerking genomen"}]
    negatief: [{tekst: "Bij ministeriële regeling worden regels gesteld.", span: "regels gesteld"}]
    rand: [{tekst: "De rente wordt gesteld op 4%.", span: "De rente wordt gesteld op"}]
    overlap: [{tekst: "Het bedrag wordt berekend. De rente wordt gesteld op 4%.", spans: ["Het bedrag wordt berekend", "De rente wordt gesteld op"]}]
- id: jas.afleiding.fictie_vermoeden
  klassen: [Afleidingsregel]
  code: LEGAL_FICTION
  bewijs: zwak
  bron: "H2:71"
  versie: 2
  bereik: segment
  niet_binnen: []
  patroon: '\b(?:wordt|worden)\s+(?:[\w-]+\s+){0,3}?(?:vermoed|geacht)\b[^,]*?(?=\s+en\s+dat\b|,|[.;:]?$)'
  tests:
    positief: [{tekst: "met dien verstande dat wordt vermoed dat de niet betaling aan hem is te wijten en dat de periode loopt.", span: "wordt vermoed dat de niet betaling aan hem is te wijten"}]
    negatief: [{tekst: "Hij vermoedt dat het klopt.", span: "vermoedt"}]
    rand: [{tekst: "de periode wordt geacht in te gaan op het tijdstip waarop het lichaam in gebreke is.", span: "wordt geacht in te gaan op het tijdstip waarop het lichaam in gebreke is"}]
    overlap: [{tekst: "wordt geacht in te gaan op het tijdstip waarop hij in gebreke is", spans: ["wordt geacht in te gaan op het tijdstip waarop hij in gebreke is", "het tijdstip waarop hij in gebreke is"]}]
- id: jas.afleiding.gelijkstelling
  klassen: [Afleidingsregel]
  code: LEGAL_EQUATION
  bewijs: zwak
  bron: "H2:71"
  versie: 1
  bereik: segment
  niet_binnen: []
  patroon: '[\s\S]*?\b(?:geldt\s+als|gelden\s+als|wordt\s+aangemerkt\s+als|worden\s+aangemerkt\s+als|wordt\s+gelijkgesteld\s+met|worden\s+gelijkgesteld\s+met|wordt\s+beschouwd\s+als|worden\s+beschouwd\s+als)\b[\s\S]*'
  tests:
    positief: [{tekst: "Als tijdstip van betaling geldt als dag de datum van ontvangst.", span: "Als tijdstip van betaling geldt als dag de datum van ontvangst."}]
    negatief: [{tekst: "De regel geldt voor iedereen.", span: "geldt voor iedereen"}]
    rand: [{tekst: "Een stiefkind wordt gelijkgesteld met een eigen kind.", span: "Een stiefkind wordt gelijkgesteld met een eigen kind."}]
    overlap: [{tekst: "Een pleegkind wordt aangemerkt als kind; een partner wordt beschouwd als gezinslid.", spans: ["Een pleegkind wordt aangemerkt als kind;", "een partner wordt beschouwd als gezinslid."]}]
- id: jas.afleiding.verhouding
  klassen: [Afleidingsregel]
  code: CALCULATION_RATIO
  bewijs: zwak
  bron: "H2:73"
  versie: 1
  bereik: segment
  niet_binnen: []
  patroon: '[\s\S]*?\b(?:in\s+dezelfde\s+verhouding|in\s+evenredigheid|evenredig\s+aan|naar\s+evenredigheid|het\s+gezamenlijke\s+bedrag\s+van|de\s+som\s+van)\b[\s\S]*'
  tests:
    positief: [{tekst: "De kosten worden verdeeld naar evenredigheid van het inkomen.", span: "De kosten worden verdeeld naar evenredigheid van het inkomen."}]
    negatief: [{tekst: "De kosten worden gedragen door de huurder.", span: "gedragen door de huurder"}]
    rand: [{tekst: "De bijdrage is evenredig aan de oppervlakte;", span: "De bijdrage is evenredig aan de oppervlakte;"}]
    overlap: [{tekst: "Het bedrag staat in dezelfde verhouding tot de rest; de uitkomst is de som van beide.", spans: ["Het bedrag staat in dezelfde verhouding tot de rest;", "de uitkomst is de som van beide."]}]
