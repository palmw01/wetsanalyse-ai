  - "het antecedent van een voornaamwoord"
deterministic_detection_possible: middel
llm_needed_for:
  - "drager van recht/plicht tegenover grammaticaal onderwerp of object"
  - "antecedent bij 'hij', 'deze', 'dergelijke' als de parse het niet eenduidig maakt"
