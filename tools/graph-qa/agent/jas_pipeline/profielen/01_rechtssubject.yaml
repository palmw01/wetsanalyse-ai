syntactic_signals:
  - "naamwoordgroep (np of np_kern) met relatie nsubj, nsubj:pass, obl:agent of iobj bij een normatief predicaat"
  - "persoonlijk voornaamwoord als onderwerp ('hij', 'zij', soms 'het') – H2:28"
  - "onbepaald of betrekkelijk voornaamwoord ('iemand', 'een ieder', 'degene', 'die') – H2:28"
lexical_signals:
  - "kopnaamwoord in het rollexicon: belastingplichtige, inspecteur, ontvanger, Onze Minister, bestuursorgaan, bestuurder, lichaam, verzekerde, partner, overtreder, voetganger, werkgever"
  - "suffix van een persoonsaanduiding: -plichtige, -gerechtigde, -hebbende, -houder, -nemer, -gever"
semantic_signals:
  - "drager van een recht of plicht in de bepaling (H2:26); geen louter grammaticaal onderwerp"
structural_signals:
  - "partij genoemd in de aanhef van een opsomming geldt voor alle onderdelen"
candidate_rules:
  - {id: jas.subject.np_bij_normatief_predicaat, status: gepland}
  - {id: jas.subject.rollexicon, status: gepland}
  - {id: jas.subject.voornaamwoord, status: gepland}
confusable_classes:
