lexical_signals:
  - "voegwoorden en inleiders hierboven; ook 'ingeval', 'behoudens', 'onverminderd'"
semantic_signals:
  - "omstandigheid waaraan voldaan moet zijn voor een rechtsgevolg (H2:62); cumulatief of alternatief"
structural_signals:
  - "onderdelen van een opsomming onder een voorwaardelijke aanhef zijn elk een (deel)voorwaarde"
