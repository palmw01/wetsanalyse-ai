  - {id: C2, soort: element_kandidaat, element: IW05/E17, klasse: Afleidingsregel}
  - {id: C3, soort: element_kandidaat, element: IW05/E01, klasse: Rechtsbetrekking, zonder_klasse: [Afleidingsregel]}
  - {id: C4, soort: element_kandidaat, element: IW05/E13, klasse: Voorwaarde}
  - {id: C5, soort: recall_niet_lager}
  - {id: C6, soort: geen_verloren_ankers}
  - {id: C7, soort: alleen_toegestane_wijzigingen, toegestaan: {}}
