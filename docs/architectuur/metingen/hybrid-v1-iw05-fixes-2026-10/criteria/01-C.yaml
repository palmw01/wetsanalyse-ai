naam: "01-C – precieze spans voor de functiedetector"
doel: >
  De afleiding 'zoveel … als …' (IW05/E05) en de toepassingsclause 'vindt het eerste lid toepassing'
  (IW05/E17) worden kandidaten op hun eigen span. De normkandidaat over de eerste volzin draagt dan
  geen Afleidingsregel meer. v1 verandert niet: die patronen komen er niet in voor.
regels:
