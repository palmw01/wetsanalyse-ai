# Loki — Azure Blob Storage backend (single-binary).
# Gebruik naast loki-config.yaml; overschrijft die NIET.
#
# Vereisten:
#   - Container app heeft system-assigned managed identity
#   - Identity heeft Storage Blob Data Contributor op het storage account
#   - Env-var STORAGE_ACCOUNT_NAME is gezet (via bicep)
#   - Blob containers: loki-chunks, loki-ruler
#   - Azure Files share loki-wal gemount op /loki (WAL + index)

auth_enabled: false

server:
  http_listen_port: 3100

# WAL en index op Azure Files (/loki); chunks naar Azure Blob.
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: azure
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  azure:
    # STORAGE_ACCOUNT_NAME wordt door de container app als env-var geïnjecteerd.
    account_name: ${STORAGE_ACCOUNT_NAME}
    use_managed_identity: true
    container_name: loki-chunks
    # TODO(bevestig): endpoint_suffix voor Azure Government/China: core.usgovcloudapi.net etc.
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m

ruler:
  storage:
    type: azure
    azure:
      account_name: ${STORAGE_ACCOUNT_NAME}
      use_managed_identity: true
      container_name: loki-ruler

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h   # 7 dagen; pas aan naar smaak
