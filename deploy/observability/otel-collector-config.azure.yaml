# OTel Collector — Azure Container Apps variant.
# Gebruik naast otel-collector-config.yaml; overschrijft die NIET.
#
# Env-vars die de bicep-module injecteert (OTel-collector ondersteunt ${VAR} substitutie):
#   TEMPO_INTERNAL_FQDN  — bijv. wetsanalyse-obs-tempo.internal.<cae-default-domain>
#   LOKI_INTERNAL_FQDN   — bijv. wetsanalyse-obs-loki.internal.<cae-default-domain>
#
# Connectors (spanmetrics + servicegraph) zijn identiek aan de homelab-config;
# alleen de exporter-endpoints wijzen naar de CAE-interne FQDN's.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

connectors:
  spanmetrics:
    namespace: traces.spanmetrics
    histogram:
      unit: ms
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
    dimensions:
      - name: http.method
      - name: http.status_code
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

  servicegraph:
    latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
    store:
      ttl: 5s
      max_items: 2000
    virtual_node_peer_attributes:
      - peer.service
      - db.name
      - db.system
      - server.address
      - net.peer.name
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    # TEMPO_INTERNAL_FQDN wordt door de container app geïnjecteerd.
    endpoint: ${TEMPO_INTERNAL_FQDN}:4317
    tls:
      insecure: true   # interne CAE-communicatie; geen TLS nodig

  otlphttp/loki:
    # LOKI_INTERNAL_FQDN wordt door de container app geïnjecteerd.
    endpoint: http://${LOKI_INTERNAL_FQDN}:3100/otlp

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, spanmetrics, servicegraph]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [batch]
      exporters: [prometheus]
