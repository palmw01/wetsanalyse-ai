# Trivy secret-scan: één beleid voor alle images (via TRIVY_SECRET_CONFIG in de *-docker-publish.yml).
#
# Sinds de images hun dependencies in /app/.venv zetten (SonarQube F2, uv sync uit de lock), scant Trivy die map ook op
# secrets. De anthropic-SDK heeft voorbeeldsleutels in zijn docstrings, en die liet de gate van graph-qa vallen. Het
# zijn geen geheimen van ons. Site-packages van derden vallen daarom buiten de secret-scan; de kwetsbaarheidsscan van
# diezelfde pakketten blijft volledig, en onze eigen code (agent/, api/, app/) blijft wél op secrets gescand.
allow-rules:
  - id: site-packages-van-derden
    description: Voorbeeldwaarden in de documentatie van geïnstalleerde pakketten (bv. de anthropic-SDK)
    path: '(^|/)app/\.venv/lib/python3\.[0-9]+/site-packages/'
