# Node en de dependencies van de frontend, voor de jobs van `poort.yml`.
#
# Zes jobs hebben `frontend/node_modules` nodig (kruistests, frontend, vier browsershards). `npm ci` kostte
# daar elk ~45 s, ook mét de npm-cache van setup-node: die bewaart alleen de tarballs, het uitpakken blijft.
# Daarom wordt `node_modules` zelf gecachet, op de lockfile én de exacte node-versie (native modules horen
# bij die versie). Bij een miss draait gewoon `npm ci`; de inhoud volgt dus altijd de lockfile.
#
# Vereist: een checkout.
name: frontend-deps
description: Node 26 plus frontend/node_modules (uit de cache, anders npm ci).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: node-versie
      id: node
      shell: bash
      run: echo "versie=$(node --version)" >> "$GITHUB_OUTPUT"
    - name: node_modules uit de cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: frontend/node_modules
        key: frontend-node-modules-${{ runner.os }}-${{ steps.node.outputs.versie }}-${{ hashFiles('frontend/package-lock.json') }}
    - name: frontend – installeren
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
