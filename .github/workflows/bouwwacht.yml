# De bouwwacht: bewaakt dat er van elke component een image op GHCR staat dat bij master hoort.
#
# WAAROM DIT BESTAAT. De publish-workflows hangen aan `on: push` naar master. Dat werkt voor een
# gewone merge, maar NIET voor een merge die uit `GITHUB_TOKEN` voortkomt: GitHub onderdrukt álle
# events die door dat token worden veroorzaakt. `dependabot-auto-merge.yml` zet auto-merge aan met
# dat token, dus als GitHub de PR vervolgens zelf merget vuurt er niets — geen `push`, en ook geen
# `pull_request: closed`. Op 8 sep 2026 landden zo vier dependency-PR's (#443, #441, #442, #438) op
# master zonder dat er één image werd gebouwd; acceptatie draaide oude code met een nieuwe lockfile.
#
# Dat is precies de reden dat de vorige oplossing niet kón werken: er stond een job
# `publish-na-merge` in dependabot-auto-merge.yml die op `closed` + `merged == true` wachtte en
# daarna de publish-workflows dispatchte. Maar `closed` wordt door dezelfde regel onderdrukt als
# `push`. Vuurt hij, dan had de push-workflow zelf al gedraaid (en bouwden er twee tegelijk);
# vuurt hij niet, dan doet hij niets. Hij is op 8 sep 2026 verwijderd ten gunste van deze wacht.
#
# HOE. Niet op een gebeurtenis wachten maar de toestand meten, zoals `<appName>-graafwacht` dat voor
# de kennisgraaf doet: elk kwartier vergelijken wat er in GHCR staat met wat er op master staat, en
# alleen bij achterstand bouwen. Daarmee is de wacht ook een vangnet voor elke ándere gemiste
# trigger — een te nauw `paths:`-filter, een handmatig verwijderde tag, een run die nooit startte.
#
# De vergelijking gaat over het OCI-label `org.opencontainers.image.revision` op `:latest` (gezet
# door docker/metadata-action; `promote.yml` toetst hetzelfde label). Staan er sinds die commit
# nieuwe commits op master die de paden van die component raken, dan loopt het image achter.
#
# De componenten, hun images en hun paden worden UIT DE PUBLISH-WORKFLOWS ZELF gelezen. Er is dus
# geen tweede lijst die kan verouderen: een vijfde component met een `*-docker-publish.yml` wordt
# vanzelf bewaakt.

name: bouwwacht

on:
  schedule:
    # Elk kwartier. GitHub voert een cron niet op de seconde uit; dat is prima, de wacht is een
    # vangnet en geen deploypad.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: bouwwacht
  cancel-in-progress: false

jobs:
  wacht:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write        # publish-workflows lezen én dispatchen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in bij GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Loopt er een image achter op master?
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, re, subprocess, sys, yaml

          OWNER = os.environ["OWNER"]
          HEAD = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True,
                                check=True).stdout.strip()

          def draai(cmd, **kw):
              return subprocess.run(cmd, capture_output=True, text=True, **kw)

          def pathspecs(paths):
              """De `paths:` van een publish-workflow als git-pathspecs.

              `!x` is in GitHub-syntax een uitsluiting; git schrijft dat als `:(exclude)`. `(glob)`
              staat erbij omdat `**` anders niet over `/` heen matcht — zonder die magie zou
              `api/**/*.md` de bestanden in `api/` zelf niet uitsluiten.
              """
              specs = []
              for p in paths:
                  if p.startswith("!"):
                      specs.append(f":(exclude,glob){p[1:]}")
                  else:
                      specs.append(f":(glob){p}")
              return specs

          def revisie(image):
              """De commit waarop `:latest` is gebouwd, of "" als het image (of het label) ontbreekt."""
              r = draai(["docker", "buildx", "imagetools", "inspect", f"{image}:latest", "--format",
                         '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}'])
              return r.stdout.strip() if r.returncode == 0 else ""

          def laatste_run(workflow):
              r = draai(["gh", "run", "list", "--workflow", workflow, "--branch", "master",
                         "--limit", "1", "--json", "headSha,status,conclusion"])
              rijen = json.loads(r.stdout or "[]") if r.returncode == 0 else []
              return rijen[0] if rijen else None

          achter, gestart = [], []
          for pad in sorted(pathlib.Path(".github/workflows").glob("*-docker-publish.yml")):
              spec = yaml.safe_load(pad.read_text(encoding="utf-8")) or {}
              trigger = spec.get(True, spec.get("on")) or {}          # PyYAML leest `on:` als True
              paden = ((trigger.get("push") or {}).get("paths")) or []
              # LET OP: GitHub expandeert workflow-expressies (dollar plus dubbele accolade) ook
              # binnen dit script. Een letterlijke zoekstring is dus al vervangen vóór python hem
              # ziet, matcht daarna niets, en de wacht denkt dat élk image ontbreekt (zo ging het bij
              # de eerste versie mis). De regex hieronder houdt die tekens uit elkaar en vervangt
              # elke expressie in de IMAGE-waarde door de owner.
              image = re.sub(r"\$\{\{[^}]*\}\}", OWNER,
                             (spec.get("env") or {}).get("IMAGE", "")).strip()
              if not paden or not image:
                  print(f"::warning::{pad.name}: geen `paths:` of `env.IMAGE` gevonden, overgeslagen")
                  continue

              rev = revisie(image)
              if not rev:
                  reden = f"geen image of revisie-label op {image}:latest"
              elif draai(["git", "merge-base", "--is-ancestor", rev, "HEAD"]).returncode != 0:
                  # Een revisie die niet in de historie van master zit (verwijderde branch, force-push)
                  # zegt niets over achterstand — dan is bouwen de veilige uitkomst.
                  reden = f"image-revisie {rev[:8]} zit niet in de historie van master"
              else:
                  nieuw = draai(["git", "log", "--oneline", f"{rev}..HEAD", "--", *pathspecs(paden)]).stdout.strip()
                  if not nieuw:
                      print(f"  {pad.name}: bij ({rev[:8]})")
                      continue
                  reden = f"sinds {rev[:8]} raakten deze commits de component:\n" + "\n".join(
                      "      " + r for r in nieuw.splitlines())

              achter.append(pad.name)
              print(f"  {pad.name}: LOOPT ACHTER — {reden}")

              # Niet blind opnieuw starten. Draait er al een build, dan is die aan zet; is de laatste
              # build op déZE commit mislukt, dan lost een herstart niets op en zou de wacht elk
              # kwartier dezelfde fout herhalen.
              run = laatste_run(pad.name)
              if run and run["status"] != "completed":
                  print(f"::notice::{pad.name} loopt achter, maar er draait al een build")
                  continue
              if run and run["headSha"] == HEAD and run["conclusion"] == "failure":
                  print(f"::warning::{pad.name} loopt achter en de laatste build van deze commit "
                        f"({HEAD[:8]}) is MISLUKT — niet opnieuw gestart, herstel de build eerst")
                  continue

              d = draai(["gh", "workflow", "run", pad.name, "--ref", "master"])
              if d.returncode != 0:
                  print(f"::error::{pad.name} kon niet worden gestart: {d.stderr.strip()}")
                  sys.exit(1)
              gestart.append(pad.name)
              print(f"::notice::{pad.name} liep achter op master → build gestart")

          if not achter:
              print("ok - elk image hoort bij master")
          elif gestart:
              print(f"\n{len(gestart)} build(s) gestart: {', '.join(gestart)}")
          PYEOF
