# Retentie voor de GHCR-image ghcr.io/<owner>/wetsanalyse-api.
# Bewaart structureel de 5 nieuwste builds (getagde versies) plus hun bijbehorende
# untagged child-manifests (SBOM/provenance-attestaties); oudere builds en verweesde
# untagged digests worden opgeruimd. dataaxiom/ghcr-cleanup-action snapt de multi-arch-/
# attestatie-graaf, zodat een behouden image of z'n provenance niet breekt.
#
# Twee triggers:
#   * workflow_run  – draait automatisch ná elke geslaagde image-build (echte opruiming).
#   * workflow_dispatch – handmatig; standaard dry-run (toont alleen wat zou worden verwijderd).
#                          Zet de input `dry_run` op false om de eenmalige opschoning echt uit
#                          te voeren.

name: ghcr-cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen tonen wat verwijderd zou worden (geen echte verwijdering)"
        type: boolean
        default: true
  workflow_run:
    workflows:
      - api-docker-publish
      - frontend-docker-publish
      - graph-qa-docker-publish
      - bwb-import-docker-publish
    branches: [master]
    types: [completed]

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    # Bij workflow_run: alleen na een geslaagde build. Bij handmatig draaien: altijd.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: API-image opruimen (bewaar laatste 5 builds)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: wetsanalyse-api
          keep-n-tagged: 5
          # latest nooit verwijderen. De `dev`-tag was beschermd zolang de dev-stack draaide; die
          # omgeving is op 27 aug 2026 opgeheven, dus dev-images vallen nu gewoon onder de retentie.
          exclude-tags: latest
          delete-untagged: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend-image opruimen (bewaar laatste 5 builds)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: wetsanalyse-frontend
          keep-n-tagged: 5
          # latest nooit verwijderen. De `dev`-tag was beschermd zolang de dev-stack draaide; die
          # omgeving is op 27 aug 2026 opgeheven, dus dev-images vallen nu gewoon onder de retentie.
          exclude-tags: latest
          delete-untagged: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: graph-qa-image opruimen (bewaar laatste 5 builds)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: graph-qa
          keep-n-tagged: 5
          # latest nooit verwijderen. De `dev`-tag was beschermd zolang de dev-stack draaide; die
          # omgeving is op 27 aug 2026 opgeheven, dus dev-images vallen nu gewoon onder de retentie.
          exclude-tags: latest
          delete-untagged: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bwb-import-image opruimen (bewaar laatste 5 builds)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: bwb-import
          keep-n-tagged: 5
          # latest nooit verwijderen. De `dev`-tag was beschermd zolang de dev-stack draaide; die
          # omgeving is op 27 aug 2026 opgeheven, dus dev-images vallen nu gewoon onder de retentie.
          exclude-tags: latest
          delete-untagged: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}
