name: Eenmalig – wis legacy-annotaties (POC-data)
# Na ADR-001 PR 18: wist ALLE annotatiedata (v1 en v2) plus de annotatieverwijzingen in
# chatberichten en de v2-laaggraphs uit één straat – zie deploy/maintenance/wis_legacy_annotaties.py.
#
# Twee stappen, bewust:
#   1. `uitvoeren` uit (default) = dry-run: telt onder slot en meldt de stand in de samenvatting.
#   2. `uitvoeren` aan + `verwacht` = de stand-JSON uit stap 1. Wijkt één getal af, dan wijzigt hij
#      niets. Productie vraagt daarbovenop de goedkeuring van de environment-reviewer.
#
# Eenmalig: na de opruiming gaan deze workflow en de inventaris er weer uit (zoals #491).
on:
  workflow_dispatch:
    inputs:
      straat:
        description: 'Welke straat'
        type: choice
        options: [acceptatie, productie]
        default: acceptatie
      uitvoeren:
        description: 'Echt wissen (uit = dry-run)'
        type: boolean
        default: false
      verwacht:
        description: 'Bij uitvoeren: de stand-JSON uit de dry-run'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: wis-legacy-annotaties-${{ inputs.straat }}
  cancel-in-progress: false
jobs:
  wis:
    runs-on: ubuntu-latest
    environment: ${{ inputs.straat }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.APP_NAME }}
      UITVOEREN: ${{ inputs.uitvoeren }}
      VERWACHT: ${{ inputs.verwacht }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Aanmelden
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET RG APP; do
            test -n "${!key}" || { echo "ontbreekt: $key"; exit 1; }
          done
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Wissen (of dry-run) in een tijdelijke job met het api-image
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, tempfile, time, yaml, zlib
          def az(*args):
              result = subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'], capture_output=True, text=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          rg, app = os.environ['RG'], os.environ['APP'] + '-api'
          current = az('containerapp', 'show', '-g', rg, '-n', app)
          container = current['properties']['template']['containers'][0]
          env = [e for e in container.get('env', []) if e['name'] in {'DATABASE_URL', 'GRAPHDB_URL', 'GRAPHDB_REPOSITORY'}]
          if not any(e['name'] == 'DATABASE_URL' for e in env):
              dbfile = next(e['value'] for e in container['env'] if e['name'] == 'DATABASE_URL_FILE')
              mount = next(m for m in container['volumeMounts'] if dbfile.startswith(m['mountPath'].rstrip('/') + '/'))
              volume = next(v for v in current['properties']['template']['volumes'] if v['name'] == mount['volumeName'])
              relative = dbfile[len(mount['mountPath'].rstrip('/')) + 1:]
              secret = next(s for s in volume['secrets'] if s['path'] == relative)
              env.append({'name': 'DATABASE_URL', 'secretRef': secret['secretRef']})
          wanted = {e['secretRef'] for e in env if e.get('secretRef')}
          secrets = az('containerapp', 'secret', 'list', '-g', rg, '-n', app, '--show-values')
          secrets = [{'name': s['name'], 'value': s['value']} for s in secrets if s['name'] in wanted]
          assert len(secrets) == len(wanted) and all(s['value'] for s in secrets)
          schrijf = os.environ['UITVOEREN'] == 'true'
          verwacht = json.loads(os.environ['VERWACHT']) if os.environ['VERWACHT'].strip() else {}
          if schrijf and not verwacht:
              raise SystemExit('Uitvoeren vraagt `verwacht`: de stand-JSON uit de dry-run.')
          assert all(isinstance(k, str) and isinstance(v, int) for k, v in verwacht.items())
          code = f'DO_WRITE = {schrijf!r}\nVERWACHT = {verwacht!r}\n'
          code += pathlib.Path('deploy/maintenance/wis_legacy_annotaties.py').read_text()
          payload = base64.b64encode(zlib.compress(code.encode())).decode()
          command = 'import base64,zlib;exec(zlib.decompress(base64.b64decode(' + repr(payload) + ')))'
          job = os.environ['APP'] + '-wis-' + os.environ['GITHUB_RUN_ID']
          config = {'location': current['location'], 'properties': {
              'environmentId': current['properties'].get('environmentId') or current['properties']['managedEnvironmentId'],
              'configuration': {'triggerType': 'Manual', 'replicaTimeout': 300, 'replicaRetryLimit': 0,
                  'manualTriggerConfig': {'parallelism': 1, 'replicaCompletionCount': 1}, 'secrets': secrets},
              'template': {'containers': [{'name': 'wis', 'image': container['image'],
                  'command': ['python', '-c'], 'args': [command], 'env': env,
                  'resources': {'cpu': 0.25, 'memory': '0.5Gi'}}]}}}
          with tempfile.TemporaryDirectory() as temp:
              path = pathlib.Path(temp) / 'job.yaml'
              path.write_text(yaml.safe_dump(config)); path.chmod(0o600)
              try:
                  az('containerapp', 'job', 'create', '-g', rg, '-n', job, '--yaml', str(path))
                  execution = az('containerapp', 'job', 'start', '-g', rg, '-n', job)['name']
                  status = ''
                  for _ in range(60):
                      status = az('containerapp', 'job', 'execution', 'show', '-g', rg, '-n', job,
                                  '--job-execution-name', execution)['properties']['status']
                      if status in {'Succeeded', 'Failed', 'Stopped'}:
                          break
                      time.sleep(5)
                  marker = 'ANNOTATIE_WIS_EXECUTED_OK' if schrijf else 'ANNOTATIE_WIS_DRY_RUN_OK'
                  logs = ''
                  for _ in range(12):   # de logs komen met vertraging binnen
                      logs = subprocess.run(['az', 'containerapp', 'job', 'logs', 'show', '-g', rg, '-n', job,
                                             '--execution', execution, '--container', 'wis', '--tail', '200'],
                                            capture_output=True, text=True).stdout
                      if marker in logs or status != 'Succeeded':
                          break
                      time.sleep(10)
                  print(logs)
                  import re
                  meldingen = {m.group(1): json.loads(base64.b64decode(m.group(2)))
                               for m in re.finditer(r'(WIS_STAND|WIS_KLAAR) ([A-Za-z0-9+/=]+)', logs)}
                  stand = meldingen.get('WIS_STAND', {})
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write(f"## Wis legacy-annotaties – {os.environ['APP']} ({'UITGEVOERD' if schrijf else 'dry-run'})\n\n")
                      f.write(f"Status: **{status}**\n\n")
                      if stand:
                          f.write('Stand onder slot (plak `stand` letterlijk als `verwacht` om uit te voeren):\n\n')
                          f.write('```json\n' + json.dumps(stand.get('stand', {}), sort_keys=True) + '\n```\n\n')
                          f.write('```json\n' + json.dumps(meldingen, indent=2, ensure_ascii=False) + '\n```\n')
                  if status != 'Succeeded' or marker not in logs:
                      raise SystemExit('Niet bevestigd: ' + status)
              finally:
                  az('containerapp', 'job', 'delete', '-g', rg, '-n', job, '--yes')
          PY
      - name: Afmelden
        if: always()
        run: az logout || true
