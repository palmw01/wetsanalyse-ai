# Azure – de standby-omgeving aan- en uitzetten.
#
# Uitsluitend handmatig: deze omgeving hoort NIET mee te bewegen met pushes naar master. Dat is de
# hele opzet – zolang niemand deze workflow start, draait er niets en kost het niets.
#
# Drie acties, met `wat-if` als default omdat die niets aanmaakt:
#   wat-if    Azure toont welke resources zouden ontstaan/wijzigen. Veilig, en de enige manier om
#             de template tegen je echte subscription te valideren (quota, regio, rechten).
#   deploy    rolt de stack daadwerkelijk uit (10-15 min; PostgreSQL is de trage stap).
#   afbreken  verwijdert de hele resource group. Vereist dat je de naam ter bevestiging intypt.
#   opruimen  verwijdert wat er in de groep staat maar NIET bij deze straat hoort (bicep ruimt zelf
#             niets op). Toont eerst wat het zou doen; verwijdert pas als je de groepsnaam intypt.
#   telemetrie vraagt de Log Analytics-workspace of er de laatste 24 uur traces/requests binnenkwamen.
#             Read-only; de controle of de OTel-keten van deze straat écht werkt.
#   inventaris leest wat er in de subscription staat en schrijft het naar de samenvatting. Puur
#             read-only (alleen `list`/`show`); bedoeld om te kunnen controleren wát er draait en
#             wat het kost, zonder lokale az-installatie – de service principal leeft alleen hier.
#   grafana   rolt ALLEEN de Grafana-app uit (deploy/azure/grafana.bicep) in de gekozen straat.
#             Apart van `deploy` omdat die GraphDB raakt: een dashboardwijziging hoort geen
#             infra-deploy te vragen. Grafana leest beide straten, dus één exemplaar volstaat —
#             draai dit dus in ÉÉN straat. Doe je het in allebei, dan krijg je twee apps die
#             hetzelfde tonen; `grafana-afbreken` ruimt de overtollige op.
#   grafana-afbreken  verwijdert de Grafana-app van de gekozen straat. Vereist de groepsnaam ter
#             bevestiging. `opruimen` doet dit niet: daar staat `$s-grafana` voor elke straat op de
#             beschermde lijst, omdat die actie niet kan weten welk exemplaar het bedoelde is.
#   mcp-proxy-afbreken  verwijdert de externe GraphDB-MCP-proxy (`<straat>-graphdb-proxy`). Vereist
#             de groepsnaam ter bevestiging. Nodig als aparte actie omdat de invoer `graphdb_proxy`
#             weer op false zetten hem NIET weghaalt: een bicep-deploy in incremental mode verwijdert
#             niets. Zie de noot bij `3b` in main.bicep voor wat die proxy is en waarom hij bestaat.
#   vul-graaf start de import-job en wacht hem af. Apart van `deploy`, want importeren schrijft naar
#             de graaf en hoort een expliciete keuze te blijven – en na een herstart van de
#             graphdb-app (die geen persistente opslag heeft) is dit de enige manier om de graaf
#             terug te krijgen zonder een volledige infra-deploy.
#
# Na een `deploy` is de omgeving nog leeg: draai de import-job om de graaf te vullen. Het commando
# staat in de samenvatting aan het eind van de run.
#
# De publish-workflows doen een image-swap (`az containerapp update`) op een bestaande app in Azure
# – die verandert geen infra, dus veilig. Deze workflow (bicep) blijft bewust handmatig: het is de
# enige die resources kan aanmaken/veranderen/verwijderen en GraphDB is niet-persistent.

name: azure-infra

on:
  workflow_dispatch:
    inputs:
      omgeving:
        description: "Welke straat"
        type: choice
        options: [acceptatie, productie]
        default: acceptatie
      actie:
        description: "Wat doen"
        type: choice
        options: [wat-if, deploy, afbreken, opruimen, vul-graaf, eval, inventaris, telemetrie, grafana, grafana-afbreken, mcp-proxy-afbreken]
        default: wat-if
      query:
        description: "Alleen voor 'telemetrie': een eigen KQL-query (leeg = de standaardset)"
        type: string
        default: ""
      graphdb_proxy:
        description: "Alleen bij 'deploy'/'wat-if' op acceptatie: de externe GraphDB-MCP-proxy uitrollen (vereist het secret WA_GRAPHDB_PROXY_TOKEN)"
        type: boolean
        default: false
      bevestig_resource_group:
        description: "Voor 'afbreken' en 'opruimen': typ de resource group ter bevestiging"
        type: string
        default: ""

# Per straat serialiseren: aan acceptatie werken hoeft niet te wachten op productie.
concurrency:
  group: azure-infra-${{ inputs.omgeving }}
  cancel-in-progress: false

jobs:
  azure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # De environment levert de credentials, de resource group en de appName van déze straat – en
    # draagt bij productie de required reviewer.
    environment: ${{ inputs.omgeving }}
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.APP_NAME }}
      # Repo-vars (niet per environment): `opruimen` moet álle straten kennen om te weten wat wees
      # is. Zie de stap "Weesresources opruimen".
      ACCEPTATIE_APP_NAME: ${{ vars.ACCEPTATIE_APP_NAME || 'wetsanalyse' }}
      PRODUCTIE_APP_NAME: ${{ vars.PRODUCTIE_APP_NAME || 'wetsanalyse-prd' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'northeurope' }}
      # Per straat: acceptatie mag koud starten en een week bewaren, productie niet.
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '7' }}
      MIN_REPLICAS_APPS: ${{ vars.MIN_REPLICAS_APPS || '0' }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
      GRAPHDB_LICENSE_B64: ${{ secrets.GRAPHDB_LICENSE_B64 }}
      LLM_API_BASE: ${{ vars.LLM_API_BASE }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-sonnet-4-6' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight (secrets aanwezig, bevestiging bij afbreken)
        run: |
          set -euo pipefail
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET; do
            [ -n "${!v:-}" ] || { echo "::error::ontbrekende secret: $v"; exit 1; }
          done
          # RESOURCE_GROUP en APP_NAME komen uit de environment-vars en hebben geen default meer:
          # een straat die niet is ingericht, hoort te falen in plaats van stilletjes op de
          # verkeerde resource group uit te komen.
          for v in RESOURCE_GROUP APP_NAME; do
            [ -n "${!v:-}" ] || { echo "::error::ontbrekende var: $v in environment '${{ inputs.omgeving }}' (zie deploy/azure/README.md)"; exit 1; }
          done

          if [ "${{ inputs.actie }}" = "afbreken" ]; then
            if [ "${{ inputs.bevestig_resource_group }}" != "$RESOURCE_GROUP" ]; then
              echo "::error::Afbreken verwijdert de hele resource group '$RESOURCE_GROUP'. Typ die naam in het bevestigingsveld."
              exit 1
            fi
            exit 0
          fi

          # Grafana weghalen is klein maar onomkeerbaar (de app is weg tot je hem opnieuw uitrolt),
          # dus dezelfde bevestiging als bij `afbreken`.
          if [ "${{ inputs.actie }}" = "grafana-afbreken" ]; then
            if [ "${{ inputs.bevestig_resource_group }}" != "$RESOURCE_GROUP" ]; then
              echo "::error::Dit verwijdert de container app '$APP_NAME-grafana'. Typ '$RESOURCE_GROUP' in het bevestigingsveld."
              exit 1
            fi
            exit 0
          fi

          # Idem voor de MCP-proxy: klein, maar het is de externe deur naar de graaf en die zet je
          # niet per ongeluk dicht terwijl je hem nodig hebt.
          if [ "${{ inputs.actie }}" = "mcp-proxy-afbreken" ]; then
            if [ "${{ inputs.bevestig_resource_group }}" != "$RESOURCE_GROUP" ]; then
              echo "::error::Dit verwijdert de container app '$APP_NAME-graphdb-proxy'. Typ '$RESOURCE_GROUP' in het bevestigingsveld."
              exit 1
            fi
            exit 0
          fi

          # Alleen voor wat-if/deploy: zonder deze twee komt de stack niet werkend op. De
          # read-only acties en `grafana` raken de applicatiestack niet en hebben ze niet nodig.
          case "${{ inputs.actie }}" in
            wat-if|deploy) ;;
            *) exit 0 ;;
          esac
          for v in AZURE_AI_KEY LLM_API_BASE; do
            [ -n "${!v:-}" ] || { echo "::error::ontbrekende secret/var: $v"; exit 1; }
          done
          if [ -z "${GRAPHDB_LICENSE_B64:-}" ]; then
            echo "::warning::secrets.GRAPHDB_LICENSE_B64 ontbreekt – GraphDB komt read-only op en de import-job zal falen. Zie deploy/azure/README.md."
          fi

      - name: Inloggen bij Azure
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" >/dev/null
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "Ingelogd op: $(az account show --query name -o tsv)"

      - name: Resource group afbreken
        if: ${{ inputs.actie == 'afbreken' }}
        run: |
          set -euo pipefail
          if ! az group exists --name "$RESOURCE_GROUP" | grep -q true; then
            echo "Resource group '$RESOURCE_GROUP' bestaat niet – niets te doen."
            exit 0
          fi

          # Acceptatie en productie delen deze groep, dus dit haalt BEIDE straten weg. Toon eerst
          # wat er sneuvelt: de bevestiging is alleen de groepsnaam, en die typ je zo. Zonder dit
          # overzicht denk je één omgeving af te breken en gooi je er twee weg.
          echo "In '$RESOURCE_GROUP' staat nu:"
          az resource list -g "$RESOURCE_GROUP" --query "sort_by([].[name, type], &[0])" -o tsv | sed 's/^/  /'
          echo ""
          echo "::warning::Dit verwijdert de HELE groep – alle straten die erin staan, met hun databases."
          echo ""
          echo "Verwijderen van '$RESOURCE_GROUP' (draait door op de achtergrond in Azure)…"
          az group delete --name "$RESOURCE_GROUP" --yes --no-wait
          echo "Opdracht gegeven. Controleer in de portal wanneer het klaar is."

      - name: Resource group waarborgen
        if: ${{ inputs.actie == 'wat-if' || inputs.actie == 'deploy' }}
        run: |
          set -euo pipefail
          az group create --name "$RESOURCE_GROUP" --location "$AZURE_LOCATION" --output none
          echo "Resource group '$RESOURCE_GROUP' gereed in $AZURE_LOCATION."

      - name: Licentie klaarzetten
        if: ${{ inputs.actie == 'wat-if' || inputs.actie == 'deploy' }}
        run: |
          set -euo pipefail
          # Het secret is base64; gen-deploy.py verwacht het RUWE bestand en codeert zelf.
          if [ -n "${GRAPHDB_LICENSE_B64:-}" ]; then
            printf '%s' "$GRAPHDB_LICENSE_B64" | base64 -d > "$RUNNER_TEMP/graphdb.license"
            echo "Licentie geplaatst ($(wc -c < "$RUNNER_TEMP/graphdb.license") bytes)."
          fi

      # De secrets van een DRAAIENDE omgeving overnemen. Zonder dit genereert gen-deploy.py bij elke
      # run verse waarden, en dan is een infra-deploy op een bestaande straat destructief: naast
      # vervallen sessies en roterende tokens gaat `llm-config-secret` mee – de Fernet-sleutel
      # waarmee de api de API-keys van modelprofielen én de 2FA-secrets van gebruikers versleutelt.
      # Roteert die, dan is dat materiaal onherstelbaar onleesbaar.
      #
      # Voorrang: een GitHub environment-secret wint, anders wat er in Azure draait, anders (verse
      # straat) laat gen-deploy.py het zelf genereren.
      - name: Bestaande secrets overnemen
        if: ${{ inputs.actie == 'wat-if' || inputs.actie == 'deploy' }}
        env:
          GH_LLM_CONFIG_SECRET: ${{ secrets.WA_LLM_CONFIG_SECRET }}
          GH_AUTH_SECRET: ${{ secrets.WA_AUTH_SECRET }}
          GH_DB_ADMIN_PASSWORD: ${{ secrets.WA_DB_ADMIN_PASSWORD }}
          GH_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.WA_ADMIN_TOKEN }}
          GH_QA_API_TOKEN: ${{ secrets.WA_QA_API_TOKEN }}
          GH_GRAPH_QA_API_TOKEN: ${{ secrets.WA_GRAPH_QA_API_TOKEN }}
          GH_GRAPHDB_TOKEN: ${{ secrets.WA_GRAPHDB_TOKEN }}
          GH_GRAPHDB_PROXY_TOKEN: ${{ secrets.WA_GRAPHDB_PROXY_TOKEN }}
        run: |
          set -euo pipefail

          uit_azure() {  # $1 = app-suffix, $2 = secretnaam
            az containerapp secret show -n "$APP_NAME-$1" -g "$RESOURCE_GROUP" \
              --secret-name "$2" --query value -o tsv 2>/dev/null || true
          }

          # $1 = naam van de WA_-var, $2 = waarde uit GitHub, $3 = waarde uit Azure.
          bewaar() {
            if [ -n "$2" ]; then waarde="$2"; bron="GitHub"; else waarde="$3"; bron="Azure"; fi
            [ -n "$waarde" ] || { echo "  $1: niet gevonden – wordt gegenereerd"; return; }
            echo "::add-mask::$waarde"
            echo "$1=$waarde" >> "$GITHUB_ENV"
            echo "  $1: overgenomen uit $bron"
          }

          bewaar WA_LLM_CONFIG_SECRET "${GH_LLM_CONFIG_SECRET:-}" "$(uit_azure api llm-config-secret)"
          bewaar WA_AUTH_SECRET       "${GH_AUTH_SECRET:-}"       "$(uit_azure frontend auth-secret)"
          bewaar WA_API_TOKEN         "${GH_API_TOKEN:-}"         "$(uit_azure frontend api-token)"
          bewaar WA_ADMIN_TOKEN       "${GH_ADMIN_TOKEN:-}"       "$(uit_azure frontend admin-api-token)"
          bewaar WA_QA_API_TOKEN      "${GH_QA_API_TOKEN:-}"      "$(uit_azure graph-qa qa-api-token)"
          # Het token waarmee graph-qa NAAR de api schrijft. Roteert dit, dan valt het schrijfpad
          # stil tot de api-app ook zijn nieuwe tokenlijst heeft – beide krijgen hem in dezelfde
          # deploy, maar overnemen is alsnog netter dan elke keer verversen.
          bewaar WA_GRAPH_QA_API_TOKEN "${GH_GRAPH_QA_API_TOKEN:-}" "$(uit_azure graph-qa wetsanalyse-api-token)"
          bewaar WA_GRAPHDB_TOKEN     "${GH_GRAPHDB_TOKEN:-}"     "$(uit_azure graph-qa graphdb-token)"
          # Het token van de externe MCP-proxy. Dit is het ENIGE token dat een mens moet kennen –
          # het gaat in de MCP-config van een werkstation – dus gen-deploy.py genereert het niet:
          # zet het als environment-secret WA_GRAPHDB_PROXY_TOKEN. De overname uit Azure staat er
          # zodat een deploy de proxy niet stilletjes van zijn token berooft. Net als bij het
          # databasewachtwoord hieronder staat de waarde niet als eigen secret in Azure maar in een
          # grotere string – hier de nginx-config, in de regel `"Bearer <token>"  1;`.
          proxy_conf=$(uit_azure graphdb-proxy proxy-config)
          proxy_tok=""
          if [ -n "$proxy_conf" ]; then
            proxy_tok=$(printf '%s' "$proxy_conf" | sed -n 's/.*"Bearer \([^"]*\)".*/\1/p' | head -1)
          fi
          bewaar WA_GRAPHDB_PROXY_TOKEN "${GH_GRAPHDB_PROXY_TOKEN:-}" "$proxy_tok"

          # Het databasewachtwoord staat niet als eigen secret maar in de connectiestring:
          #   postgresql+asyncpg://wetsanalyse:<wachtwoord>@host:5432/...
          db_url=$(uit_azure api database-url)
          db_pass=""
          if [ -n "$db_url" ]; then
            db_pass=$(printf '%s' "$db_url" | sed -n 's#^[^:]*://[^:]*:\([^@]*\)@.*#\1#p')
          fi
          bewaar WA_DB_ADMIN_PASSWORD "${GH_DB_ADMIN_PASSWORD:-}" "$db_pass"

      # Wat draait er nu? Die image-refs geven we mee aan de deployment, zodat een INFRA-wijziging
      # de images met rust laat. Zonder dit vallen de bicep-defaults (`:latest`) terug op hun plek en
      # gooit een infra-deploy de digest-pins weg die de publish-workflows er net op zetten – dan
      # weet je achteraf niet meer wélk image er draait. Bestaat een app nog niet (verse straat), dan
      # blijft de variabele leeg en pakt de bicep gewoon zijn default.
      - name: Draaiende images uitlezen
        if: ${{ inputs.actie == 'wat-if' || inputs.actie == 'deploy' }}
        id: images
        run: |
          set -euo pipefail
          VRAAG='properties.template.containers[0].image'
          app_image() {   # $1 = suffix van de container app
            az containerapp show -n "$APP_NAME-$1" -g "$RESOURCE_GROUP" --query "$VRAAG" -o tsv 2>/dev/null || true
          }
          job_image() {   # $1 = suffix van de container apps JOB
            az containerapp job show -n "$APP_NAME-$1" -g "$RESOURCE_GROUP" --query "$VRAAG" -o tsv 2>/dev/null || true
          }
          {
            echo "api=$(app_image api)"
            echo "frontend=$(app_image frontend)"
            echo "graph_qa=$(app_image graph-qa)"
            echo "bwb_import=$(job_image bwb-import)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Template valideren (what-if)
        if: ${{ inputs.actie == 'wat-if' }}
        env:
          IMG_API: ${{ steps.images.outputs.api }}
          IMG_FRONTEND: ${{ steps.images.outputs.frontend }}
          IMG_GRAPH_QA: ${{ steps.images.outputs.graph_qa }}
          IMG_BWB_IMPORT: ${{ steps.images.outputs.bwb_import }}
        run: |
          set -euo pipefail
          args=(--llm-api-base "$LLM_API_BASE" --llm-model "$LLM_MODEL"
                --resource-group "$RESOURCE_GROUP" --location "$AZURE_LOCATION"
                --app-name "$APP_NAME" --what-if
                --backup-retention-days "${BACKUP_RETENTION_DAYS:-7}"
                --min-replicas-apps "${MIN_REPLICAS_APPS:-0}")
          [ -f "$RUNNER_TEMP/graphdb.license" ] && args+=(--license-file "$RUNNER_TEMP/graphdb.license")
          [ -n "${IMG_API:-}" ]        && args+=(--api-image "$IMG_API")
          [ -n "${IMG_FRONTEND:-}" ]   && args+=(--frontend-image "$IMG_FRONTEND")
          [ -n "${IMG_GRAPH_QA:-}" ]   && args+=(--graph-qa-image "$IMG_GRAPH_QA")
          [ -n "${IMG_BWB_IMPORT:-}" ] && args+=(--bwb-import-image "$IMG_BWB_IMPORT")
          # ALLEEN ACCEPTATIE krijgt een publieke api-ingress, zodat de admin-MCP erbij kan. Die
          # ingress zit vóór de hele app – niet alleen voor /v1/admin – dus productie, waar de
          # annotaties van juristen staan, blijft dicht. Zie `apiExtern` in main.bicep.
          #
          # Deze regel staat in BEIDE takken (wat-if én uitrollen): stond hij alleen bij het
          # uitrollen, dan valideert `wat-if` een andere template dan er wordt uitgerold, en dat is
          # precies de zekerheid waarvoor die actie de default is.
          [ "${{ inputs.omgeving }}" = "acceptatie" ] && args+=(--api-extern)
          # De GraphDB-MCP-proxy: standaard NIET, en net als de api-ingress alleen op acceptatie.
          # GraphDB zelf blijft altijd intern – deze vlag zet er een nginx met tokencontrole naast.
          [ "${{ inputs.omgeving }}" = "acceptatie" ] && [ "${{ inputs.graphdb_proxy }}" = "true" ] && args+=(--graphdb-proxy-extern)
          python3 deploy/azure/gen-deploy.py "$AZURE_AI_KEY" "${args[@]}"

      - name: Uitrollen
        if: ${{ inputs.actie == 'deploy' }}
        env:
          IMG_API: ${{ steps.images.outputs.api }}
          IMG_FRONTEND: ${{ steps.images.outputs.frontend }}
          IMG_GRAPH_QA: ${{ steps.images.outputs.graph_qa }}
          IMG_BWB_IMPORT: ${{ steps.images.outputs.bwb_import }}
        run: |
          set -euo pipefail
          args=(--llm-api-base "$LLM_API_BASE" --llm-model "$LLM_MODEL"
                --resource-group "$RESOURCE_GROUP" --location "$AZURE_LOCATION"
                --app-name "$APP_NAME" --run
                --backup-retention-days "${BACKUP_RETENTION_DAYS:-7}"
                --min-replicas-apps "${MIN_REPLICAS_APPS:-0}")
          [ -f "$RUNNER_TEMP/graphdb.license" ] && args+=(--license-file "$RUNNER_TEMP/graphdb.license")
          [ -n "${IMG_API:-}" ]        && args+=(--api-image "$IMG_API")
          [ -n "${IMG_FRONTEND:-}" ]   && args+=(--frontend-image "$IMG_FRONTEND")
          [ -n "${IMG_GRAPH_QA:-}" ]   && args+=(--graph-qa-image "$IMG_GRAPH_QA")
          [ -n "${IMG_BWB_IMPORT:-}" ] && args+=(--bwb-import-image "$IMG_BWB_IMPORT")
          # ALLEEN ACCEPTATIE krijgt een publieke api-ingress, zodat de admin-MCP erbij kan. Die
          # ingress zit vóór de hele app – niet alleen voor /v1/admin – dus productie, waar de
          # annotaties van juristen staan, blijft dicht. Zie `apiExtern` in main.bicep.
          #
          # Deze regel staat in BEIDE takken (wat-if én uitrollen): stond hij alleen bij het
          # uitrollen, dan valideert `wat-if` een andere template dan er wordt uitgerold, en dat is
          # precies de zekerheid waarvoor die actie de default is.
          [ "${{ inputs.omgeving }}" = "acceptatie" ] && args+=(--api-extern)
          # De GraphDB-MCP-proxy: standaard NIET, en net als de api-ingress alleen op acceptatie.
          # GraphDB zelf blijft altijd intern – deze vlag zet er een nginx met tokencontrole naast.
          [ "${{ inputs.omgeving }}" = "acceptatie" ] && [ "${{ inputs.graphdb_proxy }}" = "true" ] && args+=(--graphdb-proxy-extern)
          python3 deploy/azure/gen-deploy.py "$AZURE_AI_KEY" "${args[@]}"

      # `az deployment group create` keert terug zodra de revisie is AANGEMAAKT, niet zodra hij
      # draait – dezelfde valkuil die de publish-workflows en promote.yml al afvangen. Zonder deze
      # stap werd een infra-deploy groen terwijl een app crashte bij het starten, en dan denk je dat
      # je hebt uitgerold. CLAUDE.md beschreef deze gate al als bestaand; dat klopte niet.
      #
      # De collector en de import-job vallen buiten de lus: een job kent geen revisies, en de
      # collector heeft geen probe waar dit iets over zegt.
      - name: Wachten tot de nieuwe revisies draaien
        if: ${{ inputs.actie == 'deploy' }}
        run: |
          set -euo pipefail
          fout=0
          apps="api graph-qa frontend graphdb"
          # De proxy staat er alleen als hij is meegevraagd; anders zou de lus over een app struikelen
          # die met opzet niet bestaat.
          [ "${{ inputs.graphdb_proxy }}" = "true" ] && apps="$apps graphdb-proxy"
          for app in $apps; do
            naam="$APP_NAME-$app"
            rev=$(az containerapp show -n "$naam" -g "$RESOURCE_GROUP" \
                    --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "")
            if [ -z "$rev" ]; then
              echo "::warning::$naam heeft geen revisie – overgeslagen."
              continue
            fi
            echo "$naam → $rev"
            gezond=""
            for _ in $(seq 1 30); do
              st=$(az containerapp revision show -n "$naam" -g "$RESOURCE_GROUP" --revision "$rev" \
                     --query "properties.runningState" -o tsv 2>/dev/null || echo Unknown)
              case "$st" in
                # ScaledToZero is gezond: de app staat op minReplicas 0 en er is nog geen verkeer.
                Running|RunningAtMaxScale|ScaledToZero) gezond="$st"; break ;;
                Failed|Degraded) echo "::error::$naam: revisie $rev kwam niet gezond op ($st)"; fout=1; break ;;
              esac
              sleep 10
            done
            if [ -n "$gezond" ]; then
              echo "  $gezond"
            elif [ "$fout" -eq 0 ]; then
              echo "::error::$naam: revisie $rev werd niet gezond binnen 5 minuten"; fout=1
            fi
          done
          [ "$fout" -eq 0 ] || exit 1
          echo "Alle apps draaien."

      - name: Grafana uitrollen
        if: ${{ inputs.actie == 'grafana' }}
        env:
          GH_GRAFANA_PASSWORD: ${{ secrets.WA_GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # Zelfde ladder als de applicatie-secrets: GitHub wint, anders overnemen wat er draait,
          # anders vers genereren. Overnemen is hier geen netheid maar noodzaak – bij elke deploy een
          # nieuw wachtwoord zetten betekent dat niemand meer binnenkomt met wat hij had opgeslagen.
          wachtwoord="${GH_GRAFANA_PASSWORD:-}"
          bron="GitHub"
          if [ -z "$wachtwoord" ]; then
            wachtwoord=$(az containerapp secret show -n "$APP_NAME-grafana" -g "$RESOURCE_GROUP" \
                           --secret-name admin-password --query value -o tsv 2>/dev/null || true)
            bron="Azure"
          fi
          if [ -z "$wachtwoord" ]; then
            wachtwoord=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
            bron="vers gegenereerd"
          fi
          echo "::add-mask::$wachtwoord"
          echo "Admin-wachtwoord: $bron"

          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/azure/grafana.bicep \
            --parameters \
              appName="$APP_NAME" \
              acceptatieAppName="$ACCEPTATIE_APP_NAME" \
              productieAppName="$PRODUCTIE_APP_NAME" \
              azureTenantId="$AZURE_TENANT_ID" \
              azureClientId="$AZURE_CLIENT_ID" \
              azureSubscriptionId="$AZURE_SUBSCRIPTION_ID" \
              azureClientSecret="$AZURE_CLIENT_SECRET" \
              grafanaAdminPassword="$wachtwoord" \
            --query "properties.outputs.grafanaUrl.value" -o tsv > "$RUNNER_TEMP/grafana-url"

          url=$(cat "$RUNNER_TEMP/grafana-url")
          echo "Grafana: $url"

          # Secrets zijn in Container Apps NIET revisie-scoped: een gewijzigde waarde levert geen
          # nieuwe revisie op, dus de draaiende container houdt de oude. Dat is precies wat hier
          # misgaat als je het admin-wachtwoord verandert – het secret staat er dan wél, maar
          # inloggen blijft 401 geven omdat Grafana nog met het vorige draait. Herstarten is de
          # enige manier waarop hij hem oppikt (en bij een lege database zet Grafana de admin
          # opnieuw uit de omgeving – er is geen volume, dus dat is elke start).
          rev=$(az containerapp show -n "$APP_NAME-grafana" -g "$RESOURCE_GROUP" \
                  --query "properties.latestRevisionName" -o tsv)
          echo "Revisie herstarten: $rev"
          az containerapp revision restart -n "$APP_NAME-grafana" -g "$RESOURCE_GROUP" \
            --revision "$rev" --output none || true

          # `az deployment group create` keert terug zodra de revisie is aangemaakt, niet zodra hij
          # draait – dezelfde valkuil als bij de app-deploys. Hier komt daar de scale-to-nul bij: de
          # eerste aanroep wekt hem, dus een 200 is pas na die koude start te verwachten.
          gezond=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/api/health" || echo 000)
            [ "$code" = "200" ] && { echo "Grafana antwoordt (200)."; gezond=1; break; }
            echo "  wacht… ($code)"
            sleep 10
          done
          # Zonder deze controle liep de stap groen af terwijl Grafana nooit opkwam – dezelfde
          # valkuil als `az containerapp update`, dat terugkeert zodra de revisie is aangemaakt.
          [ "$gezond" = "1" ] || { echo "::error::Grafana werd niet gezond binnen 5 minuten"; exit 1; }

          {
            echo "## Grafana"
            echo ""
            echo "- URL: <$url>"
            echo "- Inloggen: gebruiker \`admin\`, wachtwoord $bron."
            if [ "$bron" != "GitHub" ]; then
              echo "- Wachtwoord opvragen:"
              echo "  \`\`\`"
              echo "  az containerapp secret show -n $APP_NAME-grafana -g $RESOURCE_GROUP --secret-name admin-password --query value -o tsv"
              echo "  \`\`\`"
              echo "  Zet hem als environment-secret \`WA_GRAFANA_ADMIN_PASSWORD\` om hem vast te leggen."
            fi
            echo "- Twee dashboards in de map *Wetsanalyse*: één per straat. Ze komen uit"
            echo "  \`deploy/azure/grafana/dashboard-keten.json\` en zijn in de UI read-only."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inventaris (read-only)
        if: ${{ inputs.actie == 'inventaris' }}
        run: |
          set -euo pipefail
          {
            echo "## Azure-inventaris"
            echo ""
            echo "Subscription: \`$(az account show --query name -o tsv)\`"
            echo ""
            echo "### Resource groups"
            echo '```'
            az group list --query "sort_by([].{naam:name, regio:location}, &naam)" -o table
            echo '```'
            echo ""
            echo "### Container apps (alle resource groups)"
            echo '```'
            az containerapp list \
              --query "sort_by([].{app:name, rg:resourceGroup, extern:properties.configuration.ingress.external, replicas:properties.template.scale.minReplicas, image:properties.template.containers[0].image}, &app)" \
              -o table
            echo '```'
            echo ""
            echo "### Jobs"
            echo '```'
            az containerapp job list --query "[].{job:name, rg:resourceGroup, trigger:properties.configuration.triggerType}" -o table
            echo '```'
            echo ""
            echo "### PostgreSQL"
            echo '```'
            az postgres flexible-server list --query "[].{server:name, rg:resourceGroup, versie:version, sku:sku.name, opslagGB:storage.storageSizeGB}" -o table 2>/dev/null || echo "(geen of geen rechten)"
            echo '```'
            echo ""
            echo "### Log Analytics"
            echo '```'
            az monitor log-analytics workspace list --query "[].{workspace:name, rg:resourceGroup, retentieDagen:retentionInDays}" -o table 2>/dev/null || echo "(geen of geen rechten)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Ook naar stdout: de step summary is niet via de API terug te lezen, de runlog wel.
          echo "--- container apps ---"
          az containerapp list \
            --query "sort_by([].{app:name, extern:properties.configuration.ingress.external, minRepl:properties.template.scale.minReplicas, image:properties.template.containers[0].image}, &app)" \
            -o tsv
          echo "--- jobs ---"
          az containerapp job list --query "[].{job:name, trigger:properties.configuration.triggerType}" -o tsv
          echo "--- postgres ---"
          az postgres flexible-server list --query "[].{server:name, versie:version, sku:sku.name}" -o tsv 2>/dev/null || true
          echo "--- log analytics ---"
          az monitor log-analytics workspace list --query "[].{workspace:name, retentieDagen:retentionInDays}" -o tsv 2>/dev/null || true
          echo "--- container apps environments ---"
          az containerapp env list --query "[].{env:name, rg:resourceGroup}" -o tsv 2>/dev/null || true
          echo "--- alle resources in $RESOURCE_GROUP ---"
          az resource list -g "$RESOURCE_GROUP" --query "sort_by([].{naam:name, type:type}, &naam)" -o tsv 2>/dev/null || true

      # Ook ná een deploy, en niet alleen op verzoek: GraphDB is bewust niet-persistent, dus een
      # verse of opnieuw uitgerolde stack heeft een LEGE graaf. Dat handmatig laten was precies de
      # stap die je vergeet, en dan staat er een omgeving die nergens antwoord op geeft.
      # Alles in de resource group dat NIET bij deze straat hoort, weghalen. Bicep draait in
      # incremental mode: het verwijdert nooit iets dat niet in de template staat, dus resources van
      # een oudere opzet blijven onzichtbaar doordraaien – met hun kosten. Zo bleven na het
      # verwijderen van de wettenbank-MCP (aug 2026) de mcp-apps staan, en een hele tweede
      # `-acc`-omgeving met eigen database ernaast.
      #
      # De lijst hieronder ís de template: wat de bicep aanmaakt, hoort te blijven. De rest is wees.
      # Zonder bevestiging toont deze stap alleen wat hij zóu doen – typ de resource group in
      # `bevestig_resource_group` om echt te verwijderen.
      - name: Weesresources opruimen
        if: ${{ inputs.actie == 'opruimen' }}
        run: |
          set -euo pipefail

          # ALLE straten beschermen, niet alleen de gekozen. Acceptatie en productie delen één
          # resource group (de service principal mag er geen tweede aanmaken), dus zou "alles wat
          # niet bij ÉÉN straat hoort" betekenen dat opruimen op acceptatie de complete
          # productieomgeving weggooit – database incluis.
          straten="$ACCEPTATIE_APP_NAME $PRODUCTIE_APP_NAME"

          # Wat de bicep per straat aanmaakt (zie deploy/azure/main.bicep).
          hoort_erbij=""
          for s in $straten; do
            [ -n "$s" ] || continue
            hoort_erbij="$hoort_erbij cae-$s log-$s appi-$s $s-api $s-frontend $s-graph-qa"
            hoort_erbij="$hoort_erbij $s-graphdb $s-bwb-import $s-otel-collector $s-db"
            # De MCP-proxy is optioneel en staat er meestal niet – maar als hij er staat, is dat een
            # bewuste keuze. Zonder deze regel zou `opruimen` hem als wees weggooien.
            hoort_erbij="$hoort_erbij $s-graphdb-proxy"
            # Grafana staat in één straat maar kijkt naar beide (deploy/azure/grafana.bicep). Hij
            # hoort hier per straat in de lijst, anders ziet `opruimen` hem als wees en gooit hem weg.
            hoort_erbij="$hoort_erbij $s-grafana"
          done

          is_van_ons() {
            for n in $hoort_erbij; do [ "$1" = "$n" ] && return 0; done
            return 1
          }

          echo "Beschermde straten: $straten"
          echo "Resource group: $RESOURCE_GROUP"
          echo ""
          wezen=""
          while IFS=$'\t' read -r naam type; do
            [ -n "$naam" ] || continue
            if is_van_ons "$naam"; then
              echo "  houden   $naam ($type)"
            else
              echo "  OPRUIMEN $naam ($type)"
              wezen="$wezen$naam:$type"$'\n'
            fi
          done < <(az resource list -g "$RESOURCE_GROUP" --query "sort_by([].[name, type], &[0])" -o tsv)

          if [ -z "$wezen" ]; then
            echo ""; echo "Niets op te ruimen – de groep bevat alleen wat bij de straat hoort."
            exit 0
          fi

          if [ "${{ inputs.bevestig_resource_group }}" != "$RESOURCE_GROUP" ]; then
            echo ""
            echo "::warning::Alleen getoond. Typ '$RESOURCE_GROUP' in het bevestigingsveld om deze resources te verwijderen."
            exit 0
          fi

          # Volgorde is dwingend: apps en jobs hangen aan hun managed environment, dus die kan pas
          # weg als hij leeg is.
          echo ""; echo "Verwijderen…"
          for fase in "Microsoft.App/containerApps" "Microsoft.App/jobs" \
                      "Microsoft.App/managedEnvironments" "";
          do
            while IFS=: read -r naam type; do
              [ -n "$naam" ] || continue
              if [ -n "$fase" ]; then
                [ "$type" = "$fase" ] || continue
              else
                case "$type" in Microsoft.App/*) continue ;; esac
              fi
              echo "  - $naam ($type)"
              az resource delete -g "$RESOURCE_GROUP" -n "$naam" --resource-type "$type" --output none
            done <<< "$wezen"
          done
          echo "Klaar."

      # Komt er telemetrie binnen? De apps sturen OTLP naar de collector van deze straat, die naar
      # Application Insights schrijft – dat is een keten van drie schakels die allemaal stil kunnen
      # falen. Deze query is het enige echte bewijs dat hij werkt.
      - name: Telemetrie controleren
        if: ${{ inputs.actie == 'telemetrie' }}
        run: |
          set -euo pipefail
          ws=$(az monitor log-analytics workspace show -g "$RESOURCE_GROUP" -n "log-$APP_NAME" \
                 --query customerId -o tsv)
          echo "Workspace: log-$APP_NAME ($ws)"
          echo ""

          vraag() {  # $1 = kop, $2 = KQL
            echo "── $1 ──"
            az monitor log-analytics query -w "$ws" --analytics-query "$2" -o table 2>&1 | head -20
            echo ""
          }

          # Een eigen query wint: diagnose vraagt telkens iets anders, en een PR per vraag is geen
          # werkbare manier om een keten uit te pluizen. Read-only – `az monitor log-analytics query`
          # kan alleen lezen.
          if [ -n "${{ inputs.query }}" ]; then
            vraag "Eigen query" "${{ inputs.query }}"
            exit 0
          fi

          vraag "Telemetrie per type (24 uur)" \
            "union isfuzzy=true AppRequests, AppDependencies, AppTraces, AppExceptions
             | where TimeGenerated > ago(24h)
             | summarize aantal=count() by Type
             | order by aantal desc"

          vraag "Requests per dienst (24 uur)" \
            "AppRequests
             | where TimeGenerated > ago(24h)
             | summarize aantal=count(), p95_ms=percentile(DurationMs, 95) by AppRoleName
             | order by aantal desc"

          # Komt er niets binnen, dan zit de fout in een van de drie schakels. Deze twee queries
          # wijzen aan welke: de collector die niet opkomt of zijn config niet slikt, of een app die
          # zijn exporter niet aan de praat krijgt.
          # Let op de tabelnaam: de console-logs landen in ContainerAppConsoleLogs_CL (kolommen
          # ContainerAppName_s/Log_s). De tabel zonder _CL bestaat óók en is altijd leeg – een
          # diagnosevraag die daar kijkt meldt dus rustig "niets gevonden" terwijl er 12k regels
          # staan. Zie PR #355.
          vraag "Collector-logs (2 uur)" \
            "ContainerAppConsoleLogs_CL
             | where TimeGenerated > ago(2h) and ContainerAppName_s endswith 'otel-collector'
             | project TimeGenerated, Log_s
             | top 15 by TimeGenerated desc"

          vraag "OTel-meldingen uit de apps (2 uur)" \
            "ContainerAppConsoleLogs_CL
             | where TimeGenerated > ago(2h)
             | where Log_s has_any ('otel', 'OTLP', 'opentelemetry', 'exporter')
             | project TimeGenerated, ContainerAppName_s, Log_s
             | top 15 by TimeGenerated desc"

          # De keten frontend → api → graph-qa onder één trace-id: het hele punt van deze opzet.
          vraag "Trace-ids over meerdere diensten (24 uur)" \
            "AppRequests
             | where TimeGenerated > ago(24h)
             | summarize diensten=dcount(AppRoleName), namen=make_set(AppRoleName) by OperationId
             | where diensten > 1
             | top 5 by diensten desc"

      # Eén Grafana leest beide straten (zie `grafana`), dus een tweede exemplaar is dubbelop —
      # en `opruimen` haalt hem niet weg: daar staat `$s-grafana` voor ELKE straat op de beschermde
      # lijst, juist omdat die actie niet kan weten in welke straat hij hoort. Vandaar deze actie:
      # jij kiest de straat, en daarmee welk exemplaar sneuvelt.
      - name: Grafana afbreken
        if: ${{ inputs.actie == 'grafana-afbreken' }}
        run: |
          set -euo pipefail
          naam="$APP_NAME-grafana"
          if ! az containerapp show -n "$naam" -g "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "Container app '$naam' bestaat niet in '$RESOURCE_GROUP' – niets te doen."
            exit 0
          fi

          # Draait de andere straat er nog een? Zo niet, dan haal je hiermee de laatste Grafana weg
          # en kun je nergens meer kijken. Dat mag, maar niet per ongeluk.
          andere=""
          for kandidaat in "$ACCEPTATIE_APP_NAME" "$PRODUCTIE_APP_NAME"; do
            [ -n "$kandidaat" ] && [ "$kandidaat" != "$APP_NAME" ] || continue
            if az containerapp show -n "$kandidaat-grafana" -g "$RESOURCE_GROUP" --output none 2>/dev/null; then
              andere="$kandidaat-grafana"
            fi
          done
          if [ -n "$andere" ]; then
            echo "De andere straat draait '$andere' – die blijft staan."
          else
            echo "::warning::Dit is de LAATSTE Grafana in '$RESOURCE_GROUP'. Na deze actie is er geen dashboard meer; opnieuw uitrollen kan met actie 'grafana'."
          fi

          echo "Verwijderen van '$naam'…"
          az containerapp delete -n "$naam" -g "$RESOURCE_GROUP" --yes --output none
          echo "Weg. De dashboards komen as-code uit deploy/azure/grafana/, dus er is niets verloren."

      # De tegenhanger van `graphdb_proxy: true`. Nodig omdat een bicep-deploy in incremental mode
      # NIETS weghaalt: de vlag weer uitzetten laat de proxy gewoon draaien, hij verdwijnt er niet
      # mee. En `opruimen` beschermt hem juist (hij staat op de hoort_erbij-lijst), want die actie
      # kan niet weten of hij bedoeld is. Dus: een eigen, expliciete deur naar buiten.
      - name: MCP-proxy afbreken
        if: ${{ inputs.actie == 'mcp-proxy-afbreken' }}
        run: |
          set -euo pipefail
          naam="$APP_NAME-graphdb-proxy"
          if ! az containerapp show -n "$naam" -g "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "Container app '$naam' bestaat niet in '$RESOURCE_GROUP' – niets te doen."
            exit 0
          fi
          echo "Verwijderen van '$naam'…"
          az containerapp delete -n "$naam" -g "$RESOURCE_GROUP" --yes --output none
          echo "Weg. De graaf zelf is niet geraakt – die stond en staat intern."
          {
            echo "## MCP-proxy afgebroken"
            echo ""
            echo "\`$naam\` is verwijderd. De graaf is weer alleen intern bereikbaar."
            echo "Vergeet de MCP-registratie op je werkstation niet: \`claude mcp remove graphdb\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Graaf vullen (import-job)
        if: ${{ inputs.actie == 'vul-graaf' || inputs.actie == 'deploy' }}
        run: |
          set -euo pipefail
          JOB="$APP_NAME-bwb-import"
          az containerapp job start -n "$JOB" -g "$RESOURCE_GROUP" --output none
          # De job draait asynchroon: pak de nieuwste execution en wacht hem af. Zonder dit wachten
          # meldt de workflow succes terwijl de import nog loopt of al gefaald is.
          uitvoering=$(az containerapp job execution list -n "$JOB" -g "$RESOURCE_GROUP" \
                        --query "sort_by([], &properties.startTime)[-1].name" -o tsv)
          echo "Execution: $uitvoering"
          status=Unknown
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show -n "$JOB" -g "$RESOURCE_GROUP" \
                       --job-execution-name "$uitvoering" --query properties.status -o tsv)
            echo "[$i] $status"
            case "$status" in Succeeded|Failed|Cancelled|Degraded) break ;; esac
            sleep 10
          done
          # Logs zijn hulpmiddel, geen oordeel: niet elke CLI-versie kent dit subcommando.
          az containerapp job logs show -n "$JOB" -g "$RESOURCE_GROUP" \
            --execution "$uitvoering" --tail 60 2>/dev/null || \
            echo "(logs niet op te halen met deze CLI-versie – zie de portal)"
          {
            echo "## Import-job"
            echo ""
            echo "- Execution: \`$uitvoering\`"
            echo "- Status: **$status**"
            [ "$status" = "Succeeded" ] && echo "- De graaf staat in \`urn:bwb:\`; controleer een vraag in de webapp."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = "Succeeded" ] || { echo "::error::import-job eindigde als $status"; exit 1; }

      - name: Eval draaien (annotatieketen meten)
        if: ${{ inputs.actie == 'eval' }}
        run: |
          set -euo pipefail
          JOB="$APP_NAME-eval"
          # De job wordt door de bicep aangemaakt, dus hij bestaat pas na een `deploy`. Zonder deze
          # controle faalt `job start` met een Azure-foutmelding die niet vertelt wat je moet doen.
          if ! az containerapp job show -n "$JOB" -g "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "::error::De job '$JOB' bestaat niet in '$RESOURCE_GROUP'. Draai eerst deze workflow met actie 'deploy'; die maakt hem aan."
            exit 1
          fi
          echo "Start $JOB – drie eval-runs tegen de graaf van deze straat. Dit kost LLM-tokens."
          az containerapp job start -n "$JOB" -g "$RESOURCE_GROUP" --output none
          uitvoering=$(az containerapp job execution list -n "$JOB" -g "$RESOURCE_GROUP" \
                        --query "sort_by([], &properties.startTime)[-1].name" -o tsv)
          echo "Execution: $uitvoering"
          # Ruimer dan bij de import: zes runs (twee promptvarianten × drie) van acht annotatiecases
          # duren samen ~60 min, en de job zelf mag er twee (replicaTimeout in main.bicep).
          # 350 × 20 s = ~116 min, dus de workflow geeft het niet eerder op dan de job — anders
          # meldt hij een mislukking terwijl de meting nog loopt.
          status=Unknown
          for i in $(seq 1 350); do
            status=$(az containerapp job execution show -n "$JOB" -g "$RESOURCE_GROUP" \
                       --job-execution-name "$uitvoering" --query properties.status -o tsv)
            echo "[$i] $status"
            case "$status" in Succeeded|Failed|Cancelled|Degraded) break ;; esac
            sleep 20
          done
          # De uitkomst ÍS de log: drie rapporten met precisie/recall, span-IoU en letterlijkheid.
          # `az containerapp job logs show` gaf hier niets terug (stil, want `|| true`), dus we halen
          # ze uit Log Analytics. Let op de kolom: bij een JOB is `ContainerAppName_s` LEEG en staat
          # alleen `ContainerName_s` gevuld — filteren op de app-naam levert nul rijen op, en dat
          # leest als "geen logs" in plaats van "verkeerd gefilterd".
          ws=$(az monitor log-analytics workspace show -g "$RESOURCE_GROUP" -n "log-$APP_NAME" \
                 --query customerId -o tsv 2>/dev/null || true)
          logs=""
          if [ -n "$ws" ]; then
            # Ingestie loopt een minuut of twee achter op de container; even geduld voor we het
            # opgeven, anders rapporteren we een lege meting terwijl de regels onderweg zijn.
            for poging in 1 2 3 4; do
              logs=$(az monitor log-analytics query -w "$ws" --analytics-query \
                "ContainerAppConsoleLogs_CL
                 | where TimeGenerated > ago(2h) and ContainerName_s == 'eval'
                 | order by TimeGenerated asc
                 | project Log_s" \
                -o tsv 2>/dev/null || true)
              [ -n "$logs" ] && break
              echo "(logs nog niet in Log Analytics – poging $poging)"
              sleep 30
            done
          fi
          [ -n "$logs" ] || logs=$(az containerapp job logs show -n "$JOB" -g "$RESOURCE_GROUP" \
                                     --execution "$uitvoering" --tail 250 2>/dev/null || true)
          echo "$logs"
          {
            echo "## Eval – annotatieketen (2 promptvarianten × 3 runs)"
            echo ""
            echo "- Straat: \`$APP_NAME\` · Execution: \`$uitvoering\` · Status: **$status**"
            echo ""
            echo "Vergelijk de varianten \`vol\` en \`kort\`: die verschillen alleen in hoeveel van de"
            echo "klassenreferentie in de prompt staat (~14,5k tegen ~5,6k tekens), en beantwoorden"
            echo "de vraag of de volle brontekst beter annoteert."
            echo ""
            echo "Lees recall en span-IoU als **bandbreedte over de drie runs per variant**, niet als"
            echo "één getal: JAS-analyse kent interpretatieruimte en dezelfde bepaling levert tussen"
            echo "runs sterk verschillende uitkomsten op. De *garanties* (letterlijkheid, geldige"
            echo "klassen, binnen bereik, injectie weerstaan) horen wél op 100% te staan — die dwingt"
            echo "de code af, dus een lagere waarde is een gesneuvelde garantie en geen tegenvaller."
            echo ""
            if [ -n "$logs" ]; then
              echo '```'
              echo "$logs"
              echo '```'
            else
              echo "_(logs niet op te halen met deze CLI-versie – zie de portal)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Exitcode 1 uit de job betekent dat één van de drie runs een garantie miste. Dat is een
          # bevinding om naar te kijken, geen kapotte workflow — maar wel iets dat rood hoort te zijn.
          [ "$status" = "Succeeded" ] || { echo "::error::eval-job eindigde als $status – zie het rapport hierboven"; exit 1; }

      - name: Samenvatting
        if: ${{ always() && inputs.actie == 'deploy' }}
        run: |
          set -euo pipefail
          url=$(az deployment group show -g "$RESOURCE_GROUP" -n wetsanalyse-infra \
                  --query properties.outputs.frontendUrl.value -o tsv 2>/dev/null || echo "")
          # Leeg als de proxy niet is uitgerold. Hier tonen is de enige manier om de URL te weten te
          # komen zonder portaltoegang; het token staat er bewust NIET bij – dat kent alleen wie het
          # environment-secret heeft gezet.
          proxy_url=$(az deployment group show -g "$RESOURCE_GROUP" -n wetsanalyse-infra \
                  --query properties.outputs.graphdbProxyUrl.value -o tsv 2>/dev/null || echo "")
          {
            echo "## Azure-omgeving uitgerold"
            echo ""
            [ -n "$url" ] && echo "- Webapp: $url"
            [ -n "$proxy_url" ] && echo "- GraphDB-MCP (bearer-token vereist): $proxy_url/mcp"
            echo "- Resource group: \`$RESOURCE_GROUP\` ($AZURE_LOCATION)"
            echo ""
            echo "### Nog te doen"
            echo '1. Vul de graaf (duurt ~20s):'
            echo '   ```'
            echo "   az containerapp job start -n $APP_NAME-bwb-import -g $RESOURCE_GROUP"
            echo '   ```'
            echo "2. Maak de eerste beheerder aan op \`$url/setup\`."
            echo ""
            echo "> De graaf heeft geen persistente opslag: na een herstart van de graphdb-app moet"
            echo "> stap 1 opnieuw, en de similarity-index opnieuw gebouwd worden."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Opruimen
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/graphdb.license" deploy/azure/params.json
