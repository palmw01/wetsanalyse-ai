# Bouwt de BWB-importservice-image (wetgeving → kennisgraaf) en pusht naar GHCR.
# Draait bij wijzigingen in tools/bwb-import/ op master en bij versietags (v*).
# Spiegelt .github/workflows/graph-qa-docker-publish.yml.

name: bwb-import-docker-publish

on:
  push:
    branches: [master]
    paths:
      - "tools/bwb-import/**"
      - "!tools/bwb-import/**/*.md"
      - ".github/workflows/bwb-import-docker-publish.yml"
  workflow_dispatch:

# Twee builds van hetzelfde image tegelijk lopen elkaar in de weg: ze pushen allebei `latest` en
# `sha-…`, de laatste push ontagt de digest van de eerste, en `ghcr-cleanup` (delete-untagged) ruimt
# die vervolgens op — waarna de deploy van de eerste run faalt met `MANIFEST_UNKNOWN`. Dat gebeurde
# op 8 sep 2026 toen een push-build en een handmatige dispatch van dezelfde commit elkaar kruisten.
# `cancel-in-progress: false` laat de tweede wachten in plaats van racen; afbreken zou een uitrol
# halverwege kunnen killen.
concurrency:
  group: bwb-import-docker-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bwb-import
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/bwb-import
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in bij GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build en push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tools/bwb-import
          file: tools/bwb-import/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Trivy image-scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy-resultaten naar Security-tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy gate (faalt bij HIGH of CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ── Uitrollen naar Azure ──────────────────────────────────────────────────────
  #
  # Master rolt uit naar ACCEPTATIE; productie loopt via `promote.yml`. Dit is een Container Apps
  # JOB en geen app: er is dus geen revisie om af te wachten. De job zelf wordt niet gestart – de
  # volgende geplande of handmatige run pakt de nieuwe image op.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: acceptatie
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.APP_NAME }}
    steps:
      - name: Preflight (credentials en omgevingsvars aanwezig?)
        run: |
          set -euo pipefail
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RG APP; do
            [ -n "${!v:-}" ] || { echo "::error::ontbrekende secret/var: $v (zie deploy/azure/README.md)"; exit 1; }
          done

      - name: Azure Container App Job update (bwb-import)
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          # De doel-app moet bestaan. Bij een verse straat is de infra nog niet uitgerold en is er
          # niets om een image op te swappen – maar het image staat dan wél in GHCR. Rood worden zou
          # suggereren dat de build mislukte; dat gebeurde op 20 aug 2026 en kostte onnodig zoekwerk.
          if ! az containerapp job show -n "$APP-bwb-import" -g "$RG" --output none 2>/dev/null; then
            echo "::warning::container app job $APP-bwb-import bestaat nog niet in $RG – image is gepusht, de swap is overgeslagen. Rol eerst de infra uit (azure-infra -> deploy)."
            echo "SWAP_OVERGESLAGEN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          az containerapp job update \
            --name "$APP-bwb-import" \
            --resource-group "$RG" \
            --image "$IMAGE_DIGEST_REF" \
            --output none
          # De graafwacht draait hetzelfde image met `--alleen-bij-verlies`. Sla je hem hier over,
          # dan blijft hij op het image van de laatste infra-deploy hangen en herstelt hij de graaf
          # met oude importercode – precies de val waar de eval-job in liep (zie graph-qa/CLAUDE.md).
          # Ontbreekt hij nog, dan is de infra ouder dan deze wijziging: waarschuwen, niet falen.
          if az containerapp job show -n "$APP-graafwacht" -g "$RG" --output none 2>/dev/null; then
            az containerapp job update \
              --name "$APP-graafwacht" \
              --resource-group "$RG" \
              --image "$IMAGE_DIGEST_REF" \
              --output none
          else
            echo "::warning::job $APP-graafwacht bestaat nog niet in $RG – rol de infra uit (azure-infra -> deploy)."
          fi

      - name: Afmelden bij Azure
        if: always()
        run: az logout || true
