name: Eenmalig – inventaris legacy-annotaties (alleen lezen)
# ADR-001 PR 18 haalde de legacy-annotatieketen weg; de data die ze maakte staat nog in Postgres en
# in GraphDB. Deze actie TELT die data per straat en wijzigt niets: basis voor een apart besluit over
# wat er weg mag. Hij draait het script in een tijdelijke job met het api-image en dezelfde
# database-configuratie als de api, en ruimt die job daarna op.
#
# Eenmalig: na de opruiming gaat deze workflow er weer uit (zoals cleanup-testannotatie in #491).
on:
  workflow_dispatch:
    inputs:
      straat:
        description: 'Welke straat'
        type: choice
        options: [acceptatie, productie]
        default: acceptatie
permissions:
  contents: read
concurrency:
  group: inventaris-legacy-annotaties-${{ inputs.straat }}
  cancel-in-progress: false
jobs:
  inventaris:
    runs-on: ubuntu-latest
    environment: ${{ inputs.straat }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.APP_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Aanmelden
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET RG APP; do
            test -n "${!key}" || { echo "ontbreekt: $key"; exit 1; }
          done
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Inventaris in een tijdelijke job met het api-image
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, tempfile, time, yaml, zlib
          def az(*args):
              result = subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit(f"az {' '.join(args[:3])} faalde:\n{result.stderr.strip()}")
              return json.loads(result.stdout) if result.stdout.strip() else None
          rg, app = os.environ['RG'], os.environ['APP'] + '-api'
          current = az('containerapp', 'show', '-g', rg, '-n', app)
          container = current['properties']['template']['containers'][0]
          env = [e for e in container.get('env', []) if e['name'] in {'DATABASE_URL', 'GRAPHDB_URL', 'GRAPHDB_REPOSITORY'}]
          if not any(e['name'] == 'DATABASE_URL' for e in env):
              dbfile = next(e['value'] for e in container['env'] if e['name'] == 'DATABASE_URL_FILE')
              mount = next(m for m in container['volumeMounts'] if dbfile.startswith(m['mountPath'].rstrip('/') + '/'))
              volume = next(v for v in current['properties']['template']['volumes'] if v['name'] == mount['volumeName'])
              relative = dbfile[len(mount['mountPath'].rstrip('/')) + 1:]
              secret = next(s for s in volume['secrets'] if s['path'] == relative)
              env.append({'name': 'DATABASE_URL', 'secretRef': secret['secretRef']})
          wanted = {e['secretRef'] for e in env if e.get('secretRef')}
          secrets = az('containerapp', 'secret', 'list', '-g', rg, '-n', app, '--show-values')
          secrets = [{'name': s['name'], 'value': s['value']} for s in secrets if s['name'] in wanted]
          assert len(secrets) == len(wanted) and all(s['value'] for s in secrets)
          code = pathlib.Path('deploy/maintenance/inventaris_legacy_annotaties.py').read_text()
          payload = base64.b64encode(zlib.compress(code.encode())).decode()
          command = 'import base64,zlib;exec(zlib.decompress(base64.b64decode(' + repr(payload) + ')))'
          job = os.environ['APP'] + '-inv-' + os.environ['GITHUB_RUN_ID'][-8:]
          config = {'location': current['location'], 'properties': {
              'environmentId': current['properties'].get('environmentId') or current['properties']['managedEnvironmentId'],
              'configuration': {'triggerType': 'Manual', 'replicaTimeout': 300, 'replicaRetryLimit': 0,
                  'manualTriggerConfig': {'parallelism': 1, 'replicaCompletionCount': 1}, 'secrets': secrets},
              'template': {'containers': [{'name': 'inventaris', 'image': container['image'],
                  'command': ['python', '-c'], 'args': [command], 'env': env,
                  'resources': {'cpu': 0.25, 'memory': '0.5Gi'}}]}}}
          with tempfile.TemporaryDirectory() as temp:
              path = pathlib.Path(temp) / 'job.yaml'
              path.write_text(yaml.safe_dump(config)); path.chmod(0o600)
              try:
                  az('containerapp', 'job', 'create', '-g', rg, '-n', job, '--yaml', str(path))
                  execution = az('containerapp', 'job', 'start', '-g', rg, '-n', job)['name']
                  status = ''
                  for _ in range(60):
                      status = az('containerapp', 'job', 'execution', 'show', '-g', rg, '-n', job,
                                  '--job-execution-name', execution)['properties']['status']
                      if status in {'Succeeded', 'Failed', 'Stopped'}:
                          break
                      time.sleep(5)
                  logs = ''
                  for _ in range(12):   # de logs komen met vertraging binnen
                      logs = subprocess.run(['az', 'containerapp', 'job', 'logs', 'show', '-g', rg, '-n', job,
                                             '--execution', execution, '--container', 'inventaris', '--tail', '100'],
                                            capture_output=True, text=True).stdout
                      if 'ANNOTATIE_INVENTARIS_OK' in logs or status != 'Succeeded':
                          break
                      time.sleep(10)
                  print(logs)
                  import re
                  m = re.search(r'INVENTARIS ([A-Za-z0-9+/=]+)', logs)
                  regel = base64.b64decode(m.group(1)).decode() if m else ''
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write(f"## Inventaris legacy-annotaties – {os.environ['APP']}\n\nStatus: **{status}**\n\n")
                      f.write('```json\n' + (json.dumps(json.loads(regel), indent=2, ensure_ascii=False) if regel else logs) + '\n```\n')
                  if status != 'Succeeded' or 'ANNOTATIE_INVENTARIS_OK' not in logs:
                      raise SystemExit('Inventaris niet bevestigd: ' + status)
              finally:
                  try:
                      az('containerapp', 'job', 'delete', '-g', rg, '-n', job, '--yes')
                  except SystemExit as e:   # een mislukte create laat niets achter om te wissen
                      print(e)
          PY
      - name: Afmelden
        if: always()
        run: az logout || true
