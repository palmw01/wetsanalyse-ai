# Auto-merge voor Dependabot-PR's die patch/minor zijn of uit een van onze
# expliciete groepen komen (zie `.github/dependabot.yml` → `groups.patch-and-minor`).
# Semver-majors gaan HIER NIET vanzelf door – die verdienen menselijke review.
#
# Voorwaarde: Settings → General → "Allow auto-merge" moet AAN staan op de repo. Staat hij UIT,
# dan parkeert `gh pr merge --auto` de intentie niet maar probeert hij meteen te mergen – en dan
# botst hij op de branch protection van master (`poort` is een required check, met `strict: true`,
# dus de branch moet ook up-to-date zijn). Het gevolg is een race: verschuift master tussen de
# groene check en de merge, dan faalt de run met "Base branch was modified. Review and try the
# merge again." Zo stonden alle mislukte runs van deze workflow erbij; de instelling stond tot
# 27 aug 2026 uit. Gevaarlijk was het niet – de protection blokkeert een merge zonder groene
# `poort` – maar wél onbetrouwbaar, en niet wat de code hier bedoelt.
#
# Met de instelling AAN doet `--auto` wat er staat: de intentie wordt vastgehouden en GitHub
# merget zelf zodra de required checks groen zijn en de branch bij is. Dependabot rebaset zijn
# eigen branch, dus die tweede voorwaarde lost zichzelf op.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write        # nodig om de publish-workflows te dispatchen na een auto-merge

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Zet auto-merge aan zodra de PR een patch of minor is, óf hij komt uit onze
      # `patch-and-minor`-groep (grouped PRs rapporteren `update-type` van het
      # laagste-risico item; onze config bundelt uitsluitend patch+minor dus dat is
      # veilig). Majors én de zeldzame overige groepen slaan we over.
      - name: Enable auto-merge (patch/minor / patch-and-minor group)
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.dependency-group == 'patch-and-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

  # ── Na de merge: de publish-workflows alsnog aftrappen ────────────────────────
  #
  # Een push die door `GITHUB_TOKEN` wordt veroorzaakt start GÉÉN workflow-runs. De auto-merge
  # hierboven mergt met dat token, dus de `on: push`-publish-workflows bleven stil – en dan staat de
  # wijziging wél op master maar draait hij nergens. Dat is niet theoretisch: op 25 aug 2026 landden
  # drie dependabot-commits op master en draaide er die dag geen enkele push-workflow, ook niet voor
  # #335 dat álle vier de publish-workflowbestanden raakte (elk staat in zijn eigen `paths:`).
  #
  # `workflow_dispatch` via de API is expliciet uitgezonderd van die beperking, dus dit werkt zonder
  # PAT. Dat is de reden om het zo te doen: een persoonlijk token zou een veel bredere bevoegdheid
  # de CI in trekken om precies hetzelfde te bereiken.
  publish-na-merge:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      # Welke componenten raakte deze PR? Dezelfde paden als de `paths:`-filters van de
      # publish-workflows, inclusief het workflowbestand zelf – een bump van een action daarin
      # hoort net zo goed een rebuild op te leveren.
      - name: Dispatch de geraakte publish-workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          gewijzigd=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Gewijzigde bestanden:"; echo "$gewijzigd" | sed 's/^/  /'

          dispatch() {  # $1 = padprefix, $2 = workflowbestand
            if echo "$gewijzigd" | grep -qE "^($1|\.github/workflows/$2)"; then
              echo "→ $2"
              gh workflow run "$2" --ref master
            fi
          }

          dispatch "api/"                api-docker-publish.yml
          dispatch "frontend/"           frontend-docker-publish.yml
          dispatch "tools/graph-qa/"     graph-qa-docker-publish.yml
          dispatch "tools/bwb-import/"   bwb-import-docker-publish.yml
