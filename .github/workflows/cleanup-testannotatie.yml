name: Eenmalig testannotatie opruimen
on:
  workflow_dispatch:
    inputs:
      uitvoeren:
        description: 'Wis de gecontroleerde testlaag cf51263f2e184b80 met 7 voorstellen'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cleanup-testannotatie
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: acceptatie
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.APP_NAME }}
      UITVOEREN: ${{ inputs.uitvoeren }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Aanmelden
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET RG APP; do
            test -n "${!key}" || exit 1
          done
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Gerichte beheeractie met het bestaande API-image
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, tempfile, time, yaml, zlib
          def az(*args):
              result = subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'], capture_output=True, text=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          rg, app = os.environ['RG'], os.environ['APP'] + '-api'
          current = az('containerapp', 'show', '-g', rg, '-n', app)
          container = current['properties']['template']['containers'][0]
          env = [e for e in container.get('env', []) if e['name'] in {'DATABASE_URL', 'GRAPHDB_URL', 'GRAPHDB_REPOSITORY'}]
          assert any(e['name'] == 'DATABASE_URL' for e in env)
          wanted = {e['secretRef'] for e in env if e.get('secretRef')}
          secrets = az('containerapp', 'secret', 'list', '-g', rg, '-n', app)
          secrets = [s for s in secrets if s['name'] in wanted]
          assert all(s.get('value') for s in secrets) and len(secrets) == len(wanted)
          secrets = [{'name': s['name'], 'value': s['value']} for s in secrets]
          code = 'DO_WRITE = ' + str(os.environ['UITVOEREN'] == 'true') + '\n'
          code += pathlib.Path('deploy/maintenance/cleanup_testannotatie.py').read_text()
          payload = base64.b64encode(zlib.compress(code.encode())).decode()
          command = 'import base64,zlib;exec(zlib.decompress(base64.b64decode(' + repr(payload) + ')))'
          job = os.environ['APP'] + '-cleanup-' + os.environ['GITHUB_RUN_ID']
          config = {'location': current['location'], 'properties': {
              'environmentId': current['properties'].get('environmentId') or current['properties']['managedEnvironmentId'],
              'configuration': {'triggerType': 'Manual', 'replicaTimeout': 180, 'replicaRetryLimit': 0,
                  'manualTriggerConfig': {'parallelism': 1, 'replicaCompletionCount': 1}, 'secrets': secrets},
              'template': {'containers': [{'name': 'cleanup', 'image': container['image'],
                  'command': ['python', '-c'], 'args': [command], 'env': env,
                  'resources': {'cpu': 0.25, 'memory': '0.5Gi'}}]}}}
          with tempfile.TemporaryDirectory() as temp:
              path = pathlib.Path(temp) / 'job.yaml'
              path.write_text(yaml.safe_dump(config)); path.chmod(0o600)
              try:
                  az('containerapp', 'job', 'create', '-g', rg, '-n', job, '--yaml', str(path))
                  execution = az('containerapp', 'job', 'start', '-g', rg, '-n', job)['name']
                  status = ''
                  for attempt in range(40):
                      result = az('containerapp', 'job', 'execution', 'show', '-g', rg, '-n', job, '--job-execution-name', execution)
                      status = result['properties']['status']
                      if status in {'Succeeded', 'Failed', 'Stopped'}:
                          break
                      time.sleep(5)
                  logs = subprocess.run(['az', 'containerapp', 'job', 'logs', 'show', '-g', rg, '-n', job, '--execution', execution, '--container', 'cleanup', '--tail', '100'], capture_output=True, text=True, check=True).stdout
                  print(logs)
                  marker = 'ANNOTATIE_CLEANUP_EXECUTED_OK' if os.environ['UITVOEREN'] == 'true' else 'ANNOTATIE_CLEANUP_DRY_RUN_OK'
                  if status != 'Succeeded' or marker not in logs:
                      raise SystemExit('Opschoning niet bevestigd: ' + status)
              finally:
                  az('containerapp', 'job', 'delete', '-g', rg, '-n', job, '--yes')
          PY
      - name: Afmelden
        if: always()
        run: az logout || true
