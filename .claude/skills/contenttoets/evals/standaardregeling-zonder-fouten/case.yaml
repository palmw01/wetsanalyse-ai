schema_version: "1.1"
name: standaardregeling-zonder-fouten
expected_outcome: |
  Een toetsrapport zonder enig oordeel mogelijk onjuist: alle beweringen zijn juist. Hoogstens noemt het rapport als
  onvolledig of twijfel dat de derde uitzondering (uitstel wegens bezwaar of beroep) ontbreekt, met de afweging of dat
  materieel is. Ook *onvolledig* over de verrekening is te verwachten: de tekst zegt "Dan verrekenen wij die met uw
  schuld", en de bron zondert een voorlopige teruggaaf inkomstenbelasting over het lopende jaar daarvan uit (de derde zin
  van 25.3a.2, toegevoegd na meting C5, 26 nov 2026). Het rapport noemt de vereenvoudigde formuleringen niet onvolledig.
