schema_version: "1.1"
name: werkgebied-kwijtschelding
expected_outcome: |
  Een opzet van het werkgebied in de volgorde van de methode: aanleiding en doel van de analyse, één toetsbare
  analysevraag, deelvragen zonder artikelnummers, wat erbuiten valt, en pas daarna een aanzet voor bronnen. Een
  praktijkvoorbeeld wordt gevraagd of duidelijk als voorbeeld gemarkeerd, niet als feit verzonnen.
